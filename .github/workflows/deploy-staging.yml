name: Deploy Worker (Staging Preview)

on:
  push:
    branches:
      - staging
    paths-ignore:
      - staging-preview-url.txt

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate RH release candidate
        shell: bash
        run: |
          set -euo pipefail
          cat \
            runtime-patches/rh-folha-hotfix-v2.inc.js \
            runtime-patches/rh-folha-hotfix-v4.inc.js \
            runtime-patches/rh-folha-hotfix-v6.inc.js \
            runtime-patches/rh-folha-hotfix-v7.inc.js \
            runtime-patches/rh-folha-hotfix-v8.inc.js \
            runtime-patches/rh-folha-rc-audit.inc.js \
            runtime-patches/rh-folha-rc-history.inc.js \
            runtime-patches/rh-folha-rc-movements.inc.js \
            runtime-patches/rh-folha-rc-insights.inc.js \
            runtime-patches/rh-folha-rc-insights-fix.inc.js \
            runtime-patches/rh-folha-rc-dossier.inc.js \
            runtime-patches/rh-folha-rc-interactivity.inc.js \
            runtime-patches/rh-folha-rc-chart-modes.inc.js \
            runtime-patches/rh-folha-rc-ranking-table-fix.inc.js \
            runtime-patches/rh-folha-rc-cost-breakdown.inc.js \
            runtime-patches/rh-folha-hotfix-v11-import.inc.js \
            runtime-patches/rh-folha-hotfix-v12-periodo-consolidado.inc.js \
            runtime-patches/rh-folha-hotfix-v13-cards-popup-totais.inc.js \
            runtime-patches/rh-folha-hotfix-v14-periodo-ux-analitico.inc.js \
            runtime-patches/rh-folha-hotfix-v16-importacao-lote-pdf.inc.js \
            runtime-patches/rh-folha-hotfix-v18-todos-anos.inc.js \
            runtime-patches/rh-folha-hotfix-v19-popup-columns.inc.js \
            runtime-patches/rh-folha-hotfix-v20-popup-totals-grid.inc.js \
            runtime-patches/rh-folha-hotfix-v21-popup-period-reference.inc.js \
            runtime-patches/rh-folha-hotfix-v23-competencia-popup.inc.js \
            runtime-patches/rh-folha-hotfix-v24-planejamento-provisoes.inc.js \
            runtime-patches/rh-folha-hotfix-v25-planejamento-entry.inc.js \
            runtime-patches/rh-folha-hotfix-v26-planejamento-modelos-contabeis.inc.js \
            runtime-patches/rh-folha-hotfix-v27-jwt-refresh.inc.js \
            runtime-patches/rh-folha-hotfix-v28-planejamento-periodo-compat.inc.js \
            runtime-patches/rh-folha-hotfix-v29-rpa-integridade.inc.js \
            runtime-patches/rh-folha-hotfix-v31-rescisao-calibrada.inc.js \
            runtime-patches/rh-folha-hotfix-v32-rescisao-avos.inc.js \
            runtime-patches/rh-folha-hotfix-v33-rescisao-render-sync.inc.js \
            runtime-patches/rh-folha-hotfix-v34-motor-remuneratorio.inc.js \
            runtime-patches/rh-folha-stability-baseline.inc.js \
            runtime-patches/rh-folha-hotfix-v38-planejamento-ativos-ui.inc.js \
            runtime-patches/rh-folha-hotfix-v39-provisao-memory-router.inc.js \
            runtime-patches/rh-folha-hotfix-v40-relatorios-executivos.inc.js \
            runtime-patches/rh-folha-hotfix-v40a-runtime-stability.inc.js \
            runtime-patches/rh-folha-hotfix-v41-central-relatorios.inc.js \
            runtime-patches/rh-folha-hotfix-v41a-report-center-stability.inc.js \
            runtime-patches/rh-folha-hotfix-v42-relatorios-ajustes.inc.js \
            runtime-patches/rh-folha-hotfix-v43-correcoes.inc.js \
            runtime-patches/rh-folha-hotfix-v44-correcoes2.inc.js \
            runtime-patches/rh-folha-hotfix-v45-rescisao-relatorio-cards.inc.js \
            runtime-patches/rh-folha-hotfix-v46-estabilizacao.inc.js \
            runtime-patches/rh-folha-hotfix-v46a-interatividade.inc.js \
            runtime-patches/rh-folha-hotfix-v46b-impostos-composicao.inc.js \
            runtime-patches/rh-folha-hotfix-v47-auditoria-integral.inc.js \
            runtime-patches/rh-folha-hotfix-v48-estabilidade-popups.inc.js \
            runtime-patches/rh-folha-hotfix-v54-provisoes-seguras.inc.js \
            runtime-patches/rh-folha-hotfix-v57-base-editavel-proxima-folha.inc.js \
            runtime-patches/rh-folha-hotfix-v58-correcoes-visuais.inc.js \
            runtime-patches/rh-folha-hotfix-v59-status-filter-periodo-padrao.inc.js \
            runtime-patches/rh-folha-hotfix-v60-status-cor-desligado.inc.js \
            runtime-patches/rh-folha-hotfix-v61-cadastro-holerites-ferias.inc.js \
            runtime-patches/rh-folha-hotfix-v62-fluxos-independentes.inc.js \
            runtime-patches/rh-folha-hotfix-v63-holerite-email-controles-dp.inc.js \
            runtime-patches/rh-folha-hotfix-v66-alinhamento-identidade-recibos.inc.js \
            runtime-patches/rh-folha-hotfix-v68-simulador-salario.inc.js \
            runtime-patches/rh-folha-hotfix-v70-pacotes-ferias-rescisao.inc.js \
            runtime-patches/rh-folha-hotfix-v71-remuneracao-ferias.inc.js \
            runtime-patches/rh-folha-hotfix-v72-estabilidade-colaboradores.inc.js \
            runtime-patches/rh-folha-hotfix-v73-edicao-completa-colaboradores.inc.js \
            runtime-patches/rh-folha-hotfix-v74-chat-perguntas-prontas.inc.js \
            runtime-patches/rh-folha-hotfix-v79-edicao-periodos.inc.js \
            runtime-patches/rh-folha-hotfix-v80-provisoes-oficiais.inc.js \
            runtime-patches/rh-folha-hotfix-v83-gemini-hibrido.inc.js \
            runtime-patches/rh-folha-hotfix-v84-integridade-provisoes.inc.js \
            > runtime-patches/rh-folha-rc.inc.js

          node --check runtime-patches/rh-folha-rc.inc.js
          node scripts/rh-regression-check.js
          node scripts/rh-v57-calculation-test.js
          node scripts/rh-v68-salary-simulator-test.js
          node scripts/rh-v70-vacation-simulator-test.js
          node scripts/rh-v71-remuneration-test.js
          node scripts/rh-v72-people-stability-test.js
          node scripts/rh-v73-collaborator-edit-test.js
          node scripts/rh-v74-chat-suggestions-test.js
          node scripts/ia-tutorials-test.js
          node scripts/rh-v79-period-edit-test.js
          node scripts/rh-v80-provision-test.js
          node scripts/rh-v83-gemini-encargos-test.js
          node scripts/rh-v84-integrity-test.js
          node scripts/rh-v85-popup-official-source-test.js
          node scripts/rh-v86-consolidated-official-test.js
          node scripts/rh-v87-popup-composition-test.js
          node scripts/rh-v88-planning-stability-test.js
          node scripts/hub-auth-transition-test.js

          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('rh/app.js', 'utf8');
          const rc = fs.readFileSync('runtime-patches/rh-folha-rc.inc.js', 'utf8');
          const marker = "if(document.readyState==='loading')";
          const index = source.lastIndexOf(marker);
          if (index < 0) throw new Error('Marcador de inicialização do RH não encontrado.');
          for (const required of ['rhScopePeople', 'page-custoreal', 'openPisBreakdown', 'renderCustoReal', 'rhAuditChecks', 'rhAdvanceClosing', 'rhHistoryModel', 'renderHistory', 'rhMovementEvents', 'rhBuildBenefitSnapshot', 'renderInsights', 'renderPersonHistory', 'rhEnsurePersonHistoryUI', 'rhDossierModel', 'rhExportDossierExcel', 'rhPrintDossier', 'rhInterCardify', 'rhInterRenderHistoryCharts', 'rhInterRenderInsightsCharts', 'rhInterRenderDossierCharts', 'rhUniversalEnsureSelector', 'rhUniversalRanking', 'rhUniversalTransform', 'rhRankingApplyTemplate', 'rhRankingAggregateValue', 'rhOpenDepartmentCostBreakdown', 'rhDepartmentCostPerson', 'rhImportCompanyCode', 'rhPeriodLoad', 'rhPeriodEnsureUI', 'rhPeriodSyntheticCompetence', 'rhFitAllCardValues', 'rhEnsurePopupTotals', 'rhV14EnsureUI', 'rhV14Render', 'rhV14StampOpenPopup', 'parseBatch', 'confirmBatch', 'rh-pdf-batch', 'Todos os anos', 'rhAlignPopupColumns', 'rhV20FixAllPopupTotals', 'rhV21ApplyPopupPeriodReferences', 'rh-v23-comp', 'rhRenderPlanning', 'rhPlanTermination', 'Planejamento & Provisões', 'rhEnsurePlanningEntry', 'rhV26EnhancePlanning', 'rhV26RenderTermination', 'COMPOSIÇÃO POR COLABORADOR', 'RESUMO EXECUTIVO', 'rhEnsureFreshSession', 'rhV27IsAuthError', 'JWT', 'rhV28PlanningPeriodBridge', 'rh-v28-legacy-sinks', 'rhNormalizePayrollRpa', 'rhRpaBreakdown', 'integridade_rpa', 'rhV31RenderTermination', 'rhV31HistoricalTermination', 'CONFERÊNCIA COM HISTÓRICO IMPORTADO', 'rhV32RenderTermination', 'rhV32CorrectTermination', 'rhV33ApplyTermination', 'rhV33CorrectTermination', 'rhV34TerminationContext', 'rhV34CalcTermination', 'rhV34RenderTermination', 'BASE REMUNERATÓRIA', 'Períodos adquiridos e não gozados', 'FGTS histórico conhecido', 'rhRosterLoad', 'rhRosterActiveIds', 'rhRosterIsActive', 'rhRosterFilter', 'rhProvisionRefresh', 'rhBaselineCheck', 'RH_STABILITY_BASELINE', 'RH_CURRENT_ACTIVE_IDS', 'situacao_snapshot', 'rhV38LoadRoster', 'rhV38EnforcePlanningUI', 'rh38-name-list', 'Quadro atual', 'rhV39RouteProvisionMemory', 'RH_PROVISION_MEMORY_ROUTER', 'rhV40ExportPayrollPdf', 'rhV40ExportPayrollExcel', 'rhV40ExportGuide', 'rhV40ExportGuidePack', 'RH_EXECUTIVE_REPORTS_V40', 'RH_V40A_STABILITY', 'rhV41ExportProvisionPdf', 'rhV41ExportProvisionExcel', 'rhV41ExportTerminationPdf', 'rhV41ExportTerminationExcel', 'RH_REPORT_CENTER_V41', 'RH_REPORT_CENTER_V41A', 'Relatórios & Documentos',
            'RH_CORRECOES_V43', 'rhV43ExportTerminationPdf', 'rhV43DeduplicateForecast',
            'RH_CORRECOES_V44', 'patchRhRosterActiveIds', 'patchRhRosterLoad',
            'RH_CORRECOES_V45', 'rhV45ExportTerminationPdf', 'rhV45FitAll',
            'RH_STABILITY_V46', 'rhV46ExportForecastPdf', 'rhV46InstallFloatingAI', 'rh46-payroll-totalizer', 'RH_STABILITY_V46A',
            'RH_TAX_COMPOSITION_READONLY_V46B', 'allocateCents46b', 'readDisplayedTotals46b',
            'rhInterBindOverviewAndPayroll', 'rhInterBindChargeCards', 'rhInterBindMovementCards', 'rhInterBindCostCards', 'rhInterOpenAverageMetric', 'data-rh-authoritative-composition', 'openGuideCard',
            'RH_AUDIT_V47', 'rhV47ExportForecastPdf', 'rh47-forecast-summary', 'rh47-ai-resize',
            'RH_STABILITY_V48', 'rhV48TerminationModel', 'rhV48SyncTerminationCards', 'rh48-modal',
            
            
            
            'RH_PROVISION_SAFE_V54',
            'RH_FORECAST_V57', 'rhV57HandleCapture', 'rhV57Refresh', 'rh57-salary-edit', 'rh_atualizar_salario_folha', 'Tabela tributária', 'taxBaseMemory57', 'Formação da base', 'Ver composição',
            'RH_DP_V61', 'rh_criar_colaborador', 'rh_sincronizar_cadastros_beneficios', 'Gerar holerites PDF', 'Alertas de férias',
            'RH_DP_V62', 'rh62-new-form', 'rh62-status-form', 'Holerites em lote', 'Baixar holerite individual',
            'RH_DP_V65', 'VIA DO COLABORADOR', 'VIA DA EMPRESA', 'Assinatura do colaborador', 'Holerites e controles',
            'RH_EXPORTS_V66', 'rhV66BrandPdf', 'rhV66BrandExcel', 'RECIBO DE VERBAS RESCISÓRIAS', 'RECIBO DE FÉRIAS',
            'RH_SALARY_SIMULATOR_V68', 'rhV68CalculateSalary', 'Simulador de salário', 'Custo mensal provisionado',
            'RH_DOCUMENT_PACKAGES_V70', 'rhV70CalculateVacation', 'rhV70SyncPeople', 'Pacote completo LNB', 'AVISO DE FÉRIAS', 'TERMO DE RESCISÃO DO CONTRATO DE TRABALHO',
            'RH_VACATION_REMUNERATION_V71', 'rhV71ComposeRemuneration', 'Base carregada automaticamente', 'Histórico reversível desta sessão',
            'RH_PEOPLE_STABILITY_V72', 'rhV72IsWorking', 'Salário atual', 'Bruto no período',
            'RH_EDIT_V73', 'rh_atualizar_colaborador', 'rh73-edit-form', 'Editar cadastro',
            'RH_PERIOD_EDIT_V79', 'rh_editar_folha_colaborador', 'editar_folha_importada', 'rh_reabrir_competencia', 'rh_atualizar_status_projecao',
            'RH_OFFICIAL_PROVISIONS_V80', 'rh_provisoes_oficiais', 'COMPOSIÇÃO OFICIAL POR COLABORADOR', 'Conciliado com o Domínio',
            'RH_GEMINI_HYBRID_V83', 'contextScope', 'Automático · local + Gemini', 'rhV80OpenCard',
            'RH_PROVISION_INTEGRITY_V84', 'rhV84AuditProvision', 'Integridade conferida automaticamente', 'Divergência no demonstrativo oficial',
            'rhV48ProvisionRows', 'Fonte prioritaria: demonstrativo oficial',
            'rhV80OfficialCompetence', '_periodCompetencias',
            'rh:v80-rendered', 'rh80-compact', 'rhV80EnsureComposition',
            'rh80-person-list', 'rh80-memory-grid', 'rh80Signature',

            ]) {
            if (!rc.includes(required)) throw new Error(`Release candidate sem recurso obrigatório: ${required}`);
          }
          const effective = source.slice(0, index)
            + '\n/* LNB RH RELEASE CANDIDATE */\n'
            + rc
            + '\n'
            + source.slice(index);
          fs.writeFileSync('/tmp/rh-app-effective.js', effective);
          NODE

          node --check /tmp/rh-app-effective.js

      - name: Upload preview version to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: versions upload

      - name: Record preview URL
        env:
          CMD_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          URL="$(printf '%s\n' "$CMD_OUTPUT" | grep -Eo 'https://[^[:space:]]+workers\.dev[^[:space:]]*' | tail -1 || true)"
          if [ -z "$URL" ]; then
            printf '%s\n' "$CMD_OUTPUT" > staging-preview-url.txt
          else
            printf '%s\n' "$URL" > staging-preview-url.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add staging-preview-url.txt
          git diff --cached --quiet || git commit -m "chore(staging): record preview URL [skip ci]"
          git push
