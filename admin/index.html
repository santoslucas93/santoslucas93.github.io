<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrador Mestre · Painel LNB</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{
  --deep:#0a1930; --deep2:#0d2140; --deep3:#12294c;
  --gold:#E8B93C; --gold-dim:rgba(232,185,60,.35);
  --emer:#0F5B44; --emer-lt:#17805f;
  --bg:#eef1f6; --card:#ffffff; --line:#e2e7f0; --line2:#eef1f6;
  --tx:#16233a; --tx2:#5d6b82; --tx3:#8d99ad;
  --ok:#13805D; --ok-bg:#e6f5ee; --ok-bd:#bfe4d5;
  --warn:#a8710b; --warn-bg:#fdf4e3; --warn-bd:#f0dcae;
  --bad:#b3363a; --bad-bg:#fdecec; --bad-bd:#f3c9ca;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
     background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;transition:filter .15s,background .15s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:#fff;color:var(--tx);border:1px solid var(--line)}
.btn:hover:not(:disabled){background:#f7f9fc}
.btn-esm{background:var(--ok);color:#fff;font-weight:600}
.btn-ouro{background:var(--gold);color:#20160a;font-weight:600}
.btn-perigo{background:var(--bad);color:#fff;font-weight:600}
.btn-peq{padding:6px 11px;font-size:12.5px}
input,select{font:inherit;background:#fff;color:var(--tx);border:1px solid var(--line);
             border-radius:8px;padding:8px 10px;outline:none;max-width:100%}
input:focus,select:focus{border-color:var(--ok)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok);padding:0}
code{font-size:12px;color:var(--tx2)}

/* ---------- topo ---------- */
header{background:linear-gradient(120deg,var(--deep),var(--deep2) 55%,#0b2038);color:#EAF0FA;
       padding:14px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header .marca{display:flex;align-items:center;gap:12px}
header .escudo{width:42px;height:42px;border-radius:11px;background:rgba(232,185,60,.14);
       border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-size:20px}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em}
header .sub{font-size:12px;color:#9FB0C7;margin-top:1px}
header .meio{flex:1;text-align:center;min-width:180px}
header .meio b{font-size:15px;display:block;color:#fff}
header .meio span{font-size:12px;color:#9FB0C7}
header .meio i{color:var(--gold);font-style:normal;font-weight:600}
header .quem{border:1px solid var(--gold-dim);background:rgba(232,185,60,.08);border-radius:20px;
       padding:6px 14px;font-size:12.5px;color:#EAF0FA;display:flex;align-items:center;gap:8px}
header .quem b{color:var(--gold)}

/* ---------- estrutura ---------- */
#app{display:none;min-height:calc(100vh - 71px)}
.painel{display:flex;align-items:stretch;min-height:calc(100vh - 71px)}
aside{width:246px;flex:0 0 246px;background:var(--deep);color:#c8d4e6;padding:18px 0 24px;
      display:flex;flex-direction:column;gap:6px}
aside .rot{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7f8fa8;padding:0 20px 10px}
aside nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
aside nav button{background:transparent;color:#c8d4e6;text-align:left;border-radius:9px;padding:10px 12px;
      font-size:13.5px;display:flex;align-items:center;gap:10px;width:100%}
aside nav button:hover{background:rgba(255,255,255,.05)}
aside nav button.on{background:rgba(19,128,93,.28);color:#fff;font-weight:600;
      box-shadow:inset 2px 0 0 var(--ok-bd)}
aside .rapidas{margin-top:auto;padding:0 12px}
aside .rapidas .rot{padding:16px 8px 8px}
aside .rapidas button{width:100%;background:rgba(255,255,255,.06);color:#e6edf7;border:1px solid rgba(255,255,255,.09);
      text-align:left;margin-bottom:7px;font-size:12.5px;padding:9px 12px}

main{flex:1;padding:22px 26px 60px;min-width:0}
.tit{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.tit .ico{width:44px;height:44px;border-radius:12px;background:var(--ok-bg);border:1px solid var(--ok-bd);
      display:flex;align-items:center;justify-content:center;font-size:19px}
.tit h2{margin:0;font-size:20px;font-weight:800}
.tit p{margin:2px 0 0;color:var(--tx2);font-size:13px}
.tit .dir{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2)}

.abas{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.abas button{background:transparent;color:var(--tx2);border-radius:8px 8px 0 0;padding:10px 16px;
      border-bottom:2px solid transparent;font-size:13.5px}
.abas button.on{color:var(--ok);border-bottom-color:var(--ok);font-weight:600;background:#fff}

.colunas{display:flex;gap:18px;align-items:flex-start}
.colunas .principal{flex:1;min-width:0}
.colunas .lado{width:290px;flex:0 0 290px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1180px){ .colunas{flex-direction:column} .colunas .lado{width:100%;flex:1 1 auto} }

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);
      display:flex;align-items:center;gap:8px}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.espaco{margin-left:auto}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-size:11.5px;color:var(--tx2);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 12px;color:var(--tx2);font-weight:600;font-size:11.5px;
   text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8fafc}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:#f8fafc}
.matriz{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:66vh}
.matriz th{position:sticky;top:0;z-index:2}
.matriz td.est{white-space:nowrap}
.matriz th.acao{text-align:center}
.matriz td.cel{text-align:center;width:118px}
.perm-passos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.perm-passo{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:flex;gap:10px;align-items:center;min-width:0}
.perm-passo .num{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eaf0fb;color:#28518f;font-weight:800}
.perm-passo b{display:block;font-size:12.5px}.perm-passo span{display:block;color:var(--tx2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perm-passo.on{border-color:var(--ok-bd);background:var(--ok-bg)}.perm-passo.on .num{background:var(--ok);color:#fff}
.perm-seletor{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.perm-seletor .rotulo{font-size:12px;color:var(--tx2);font-weight:700}.perm-seletor select{min-width:280px;font-weight:700}
.perm-modulo{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.perm-modulo-topo{padding:14px 16px;background:linear-gradient(90deg,#f8fafc,#fff);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.perm-modulo-topo h3{margin:0;font-size:14px;color:var(--tx);text-transform:none;letter-spacing:0}.perm-modulo-topo .contagem{font-size:11.5px;color:var(--tx2)}
.perm-modulo-topo .acoes{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.perm-modulo .matriz{border:0;border-radius:0;max-height:none}.perm-modulo .matriz th{top:0}
.perm-coluna{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:104px}
.perm-coluna button{padding:4px 8px;font-size:10.5px;white-space:nowrap}
.perm-check{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:96px;border-radius:8px;padding:6px 9px;border:1px solid var(--bad-bd);background:var(--bad-bg);color:var(--bad);font-size:11.5px;font-weight:700;cursor:pointer}
.perm-check.on{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok)}
.perm-check .box{width:15px;height:15px;border:1.5px solid currentColor;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;background:#fff}
.perm-todas{min-width:72px}.perm-ajuda{background:#f8fafc;border:1px dashed #cfd8e7;border-radius:10px;padding:11px 13px;margin-bottom:14px;color:var(--tx2);font-size:12.5px}
.perm-alteracoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.perm-alteracoes .chave{margin:0;text-align:center}.perm-alteracoes .chave b{font-size:22px}

.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;
      border:1px solid transparent;cursor:pointer;user-select:none;min-width:86px;text-align:center}
.pill.p{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.pill.l{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.pill.b{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-bd)}
.pill.n{background:transparent;color:var(--tx3);border-color:transparent;cursor:default}
.pill.mudou{box-shadow:0 0 0 2px rgba(19,128,93,.25)}

.no0 td.est{font-weight:700}
.no1 td.est{padding-left:30px}
.no2 td.est{padding-left:56px;color:var(--tx2)}
.setinha{display:inline-block;width:16px;color:var(--tx3);cursor:pointer;user-select:none}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.tag-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.tag-off{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-bd)}
.tag-av{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.tag-perfil{background:#eaf0fb;color:#28518f;border-color:#cfdcf3;margin:2px 3px 2px 0}
.tag-mestre{background:#fdf3d8;color:#8a6608;border-color:#f0dcae;margin:2px 3px 2px 0}

.resumo{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.resumo:last-child{border-bottom:none}
.resumo b{font-weight:700}
.chave{background:#f4f7fb;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.chave b{display:block;font-size:13px}
.chave span{font-size:12px;color:var(--tx2)}

.aviso{border-left:3px solid var(--warn);background:var(--warn-bg);padding:11px 14px;border-radius:0 8px 8px 0;
       margin-bottom:16px;font-size:13px;color:#6b4a06}
.aviso b{color:#7a5406}
.erro{border-left-color:var(--bad);background:var(--bad-bg);color:#7d2427}
.erro b{color:#8f2a2d}
.bom{border-left-color:var(--ok);background:var(--ok-bg);color:#0d5a43}
.bom b{color:#0d5a43}

.chaveta{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:7px 0;
         border-bottom:1px solid var(--line2);width:100%;justify-content:space-between}
.switch{width:38px;height:21px;border-radius:20px;background:#d7dee9;position:relative;cursor:pointer;flex:0 0 38px}
.switch.on{background:var(--ok)}
.switch i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on i{left:19px}

.legenda{display:flex;gap:26px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}
.legenda b{display:block;color:var(--tx);font-size:12.5px}
.rodape{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(238,241,246,0),var(--bg) 40%);
        padding:14px 0 4px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.vazio{color:var(--tx2);padding:26px;text-align:center;font-style:italic}
.carregando{color:var(--tx2);padding:26px;text-align:center}

#capa{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(160deg,var(--deep),#081426);z-index:100;padding:20px}
#capa .box{width:100%;max-width:390px;background:rgba(18,41,76,.72);border:1px solid var(--gold-dim);
           border-radius:14px;padding:26px;color:#EAF0FA}
#capa h1{font-size:15px;margin:0 0 4px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
#capa p{color:#9FB0C7;font-size:12.5px;margin:0 0 18px}
#capa button{width:100%}
#capa a{text-decoration:none}
.msg{margin-top:12px;font-size:12.5px;min-height:18px;color:#9FB0C7}
.msg.ruim{color:#f08f92}
.modal-fundo{position:fixed;inset:0;z-index:300;background:rgba(6,17,32,.72);display:flex;
             align-items:center;justify-content:center;padding:20px}
.modal-caixa{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;
             box-shadow:0 24px 80px rgba(4,13,27,.35);border:1px solid var(--line)}
.modal-topo{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-topo h2{font-size:18px;margin:0}.modal-topo p{font-size:12.5px;color:var(--tx2);margin:3px 0 0}
.modal-fechar{margin-left:auto;background:transparent;color:var(--tx2);font-size:20px;padding:0 6px}
.modal-corpo{padding:20px}.modal-acoes{display:flex;justify-content:flex-end;gap:10px;padding:15px 20px;
              border-top:1px solid var(--line);background:#f8fafc;border-radius:0 0 14px 14px}
.form-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grade .largo{grid-column:1/-1}
textarea{font:inherit;background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:8px;
         padding:8px 10px;outline:none;max-width:100%;resize:vertical}
textarea:focus{border-color:var(--ok)}
@media (max-width:680px){.form-grade{grid-template-columns:1fr}.form-grade .largo{grid-column:auto}}
@media (max-width:900px){.perm-passos{grid-template-columns:1fr}.perm-passo span{white-space:normal}.perm-seletor select{min-width:0;width:100%}}
</style>
</head>
<body>

<div id="capa">
  <div class="box">
    <h1>🛡️ Administrador Mestre</h1>
    <p>Painel LNB · acesso restrito</p>
    <div id="capa-form"></div>
    <div class="msg" id="capa-msg">Verificando sessão…</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="marca">
      <span class="escudo">🛡️</span>
      <div>
        <h1>Administrador Mestre</h1>
        <div class="sub">Controle central de usuários, perfis e permissões</div>
      </div>
    </div>
    <div class="meio">
      <b>Temporada 2026/2027</b>
      <span>Nossa Terra tem Basquete 🏀 <i>AQUI É O NOSSO LUGAR</i></span>
    </div>
    <div class="quem">🔒 <span id="hd-nome">—</span> · <b id="hd-papel">—</b></div>
    <button class="btn btn-peq" id="bt-minha-senha">⚙ Minha senha</button>
    <button class="btn btn-peq" id="bt-voltar">↩ Voltar ao painel</button>
    <button class="btn btn-peq" id="bt-sair">Sair de tudo</button>
  </header>

  <div class="painel">
    <aside>
      <div class="rot">Painel do admin</div>
      <nav id="menu">
        <button data-tela="visao" class="on">📈 Visão Geral</button>
        <button data-tela="usuarios">👥 Usuários</button>
        <button data-tela="perfis">🛡️ Perfis de Acesso</button>
        <button data-tela="permissoes">🔒 Permissões</button>
        <button data-tela="departamentos">🏛️ Departamentos</button>
        <button data-tela="grupos">🗂️ Grupos</button>
        <button data-tela="linhas">📋 Linhas</button>
        <button data-tela="logs">🕘 Logs de Ações</button>
        <button data-tela="config">⚙️ Configurações</button>
      </nav>
      <div class="rapidas">
        <div class="rot">Ações rápidas</div>
        <button id="bt-novo-perfil">＋ Novo perfil</button>
        <button id="bt-exportar-perm">⤓ Exportar permissões</button>
      </div>
    </aside>

    <main>
      <div id="banner"></div>
      <div id="tela"></div>
    </main>
  </div>
</div>

<script>
'use strict';
/* ===========================================================================
   Administrador Mestre — Painel LNB
   Camada global de usuarios, perfis, permissoes e escopo de dados.

   Principios seguidos aqui:
   - Nenhuma biblioteca externa.
   - A chave do Supabase vem de /api/config, igual aos demais modulos.
   - A autorizacao real esta no banco (RLS + tem_permissao). Esta tela apenas
     configura e nao mostra o que a pessoa nao pode usar. Esconder botao nao e
     seguranca, e conveniencia.
   - Esta tela NAO tem login proprio: reaproveita a sessao ja aberta em um dos
     modulos. Nenhuma senha passa por aqui.
   =========================================================================== */

var CFG=null, SES=null, ACESSO=null, MODO=null;
var D = { usuarios:[], perfis:[], recursos:[], acoes:[], vinculos:[],
          departamentos:[], grupos:[], linhas:[], escopos:[], excecoes:[], logs:[] };
var TELA='visao', SUBABA='telas', PERFIL=null;
var MODO_PERM='cracha', PESSOA=null;
var NOVO_PERFIL_PARA=null;
var PERM={}, ESC={}, PERM_ORIGINAL={}, ESC_ORIGINAL={}, HIST_PERM=[], SUJO=false;
var FILTRO={ modulo:'', moduloTela:'', depto:'', grupo:'', linha:'' };
var ABERTO={};

var CHAVES_SESSAO=['lnb_auth_session_v1','lnb_auth_session_beneficios_v1'];
try{ localStorage.removeItem('lnb_auth_session_admin_v1'); }catch(e){}

var COLUNAS=[
  {id:'visualizar', rot:'Visualizar', ico:'👁', tela:'visualizar'},
  {id:'alterar',    rot:'Alterar',    ico:'✏️', tela:'editar'},
  {id:'incluir',    rot:'Incluir',    ico:'＋', tela:'criar'},
  {id:'excluir',    rot:'Excluir',    ico:'🗑', tela:'excluir'}
];
var COLUNAS_TELAS=COLUNAS.concat([{id:'importar',rot:'Importar',ico:'📥',tela:'importar'}]);
var ACOES_TELA_CRUD=['visualizar','criar','editar','excluir','importar'];
var GLOBAIS=[
  {recurso:'orcamento', acao:'exportar',        rot:'Exportar relatórios',      desc:'Tirar dados do sistema'},
  {recurso:'orcamento', acao:'importar',        rot:'Importar extrato',         desc:'Trazer planilha/extrato para dentro'},
  {recurso:'orcamento', acao:'realocar',        rot:'Realocar valores',         desc:'Mover valor de uma linha para outra'},
  {recurso:'orcamento', acao:'transferir',      rot:'Transferir entre áreas',   desc:'Passar valor entre departamentos'},
  {recurso:'orcamento', acao:'aprovar',         rot:'Aprovar orçamento',        desc:'Aprovar o planejado da temporada'},
  {recurso:'orcamento', acao:'configurar',      rot:'Editar estrutura',         desc:'Mexer em departamentos, grupos e linhas'},
  {recurso:'orcamento', acao:'administrar',     rot:'Administrar o módulo',     desc:'Tudo do Orçado x Realizado'},
  {recurso:'orcamento', acao:'ver_valores',     rot:'Ver valores em R$',        desc:'Sem isto, vê a estrutura sem os números'},
  {recurso:'orcamento', acao:'ver_remuneracao', rot:'Ver remuneração (RH)',     desc:'O conteúdo dos grupos RH'},
  {recurso:'rh',        acao:'importar',        rot:'Importar folha',            desc:'Processar PDF, Excel ou CSV de folha'},
  {recurso:'rh',        acao:'exportar',        rot:'Exportar relatórios de RH', desc:'Gerar planilhas a partir do histórico'},
  {recurso:'rh',        acao:'ver_valores',     rot:'Ver totais da folha',       desc:'Consultar valores consolidados'},
  {recurso:'rh',        acao:'ver_nomes',       rot:'Ver nomes de colaboradores',desc:'Exibir a identificação dos colaboradores'},
  {recurso:'rh',        acao:'ver_valores_individuais', rot:'Ver folha individual', desc:'Abrir composição e rubricas por colaborador'},
  {recurso:'rh',        acao:'administrar',     rot:'Administrar RH & Folha',    desc:'Gerenciar competências e configurações'},
  {recurso:'admin',     acao:'visualizar',      rot:'Abrir a Administração',    desc:'Entrar nesta tela'},
  {recurso:'admin',     acao:'administrar',     rot:'Gerenciar usuários e permissões', desc:'Conceder e revogar acesso'}
];

/* ---------- utilidades ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function api(caminho, o){
  o = o || {};
  var h = { 'apikey':CFG.SUPABASE_KEY, 'Authorization':'Bearer '+SES.access_token, 'Content-Type':'application/json' };
  if (o.prefer) h['Prefer'] = o.prefer;
  return fetch(CFG.SUPABASE_URL+'/rest/v1/'+caminho, {
    method:o.method||'GET', headers:h, body:o.body?JSON.stringify(o.body):undefined
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' — '+t.slice(0,200)); });
    /* O PostgREST pode responder 200, 201 ou 204 sem corpo quando a chamada usa
       Prefer: return=minimal. Tentar r.json() nesse caso transforma uma gravacao
       bem-sucedida em "Unexpected end of JSON input" e interrompe o restante do
       salvamento. Le o corpo uma vez e so interpreta JSON quando ha conteudo. */
    return r.text().then(function(t){ return t.trim() ? JSON.parse(t) : null; });
  });
}
function rpc(nome,args){ return api('rpc/'+nome,{method:'POST',body:args||{}}); }
async function trocarSenhaDeUsuario(uid,senha){
  if(!CFG||!SES||!SES.access_token) throw new Error('Sessão administrativa indisponível.');
  const r=await fetch(CFG.SUPABASE_URL+'/functions/v1/trocar-senha',{method:'POST',headers:{'apikey':CFG.SUPABASE_KEY,'Authorization':'Bearer '+SES.access_token,'Content-Type':'application/json'},body:JSON.stringify({usuario_id:uid,senha:senha})});
  let body={};try{body=await r.json();}catch(e){}
  if(!r.ok||!body.ok) throw new Error(body.erro||body.message||'A troca foi recusada.');
  return body;
}

async function lnbUpdateOwnPassword(session, supabaseUrl, supabaseKey, password){
  if(!session || !session.access_token) throw new Error('Sua sessão não está disponível. Entre novamente.');
  const r=await fetch(supabaseUrl+'/auth/v1/user',{
    method:'PUT',
    headers:{'apikey':supabaseKey,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},
    body:JSON.stringify({password:password})
  });
  let body={}; try{ body=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(body.msg||body.message||body.error_description||body.error||'O Supabase recusou a alteração.');
  return body;
}

function verificarAcesso(){
  return Promise.all([ rpc('meu_acesso'), rpc('qtd_adm_mestres_ativos') ]).then(function(res){
    var a=res[0], mestres=res[1];
    ACESSO=a;
    if(!a || !a.autenticado) return {ok:false,motivo:'Sessão inválida.'};
    if(!a.cadastrado)        return {ok:false,motivo:'Sua conta autenticou, mas não está cadastrada no Painel LNB.'};
    if(a.usuario.bloqueado)  return {ok:false,motivo:'Sua conta está bloqueada.'};
    if(!a.usuario.ativo)     return {ok:false,motivo:'Sua conta está inativa.'};
    if(a.acesso_total) return {ok:true,modo:'mestre'};
    var p=a.permissoes;
    if(p && p!=='*' && p.admin && p.admin.indexOf('administrar')>=0) return {ok:true,modo:'delegado'};
    /* Implantacao: enquanto NAO existir nenhum Administrador Mestre, as contas de
       administrador de hoje abrem esta tela — e o mesmo poder que ja tem. Assim que
       o primeiro Mestre nominal existir, esta porta fecha sozinha. */
    if(mestres===0){
      return rpc('current_user_role').then(function(papel){
        if(papel==='administrador') return {ok:true,modo:'implantacao'};
        return {ok:false,motivo:'Você não tem permissão para a Administração Mestre.'};
      });
    }
    return {ok:false,motivo:'Você não tem permissão para a Administração Mestre.'};
  });
}

function gruposDistintos(){
  var v={}, s=[];
  D.grupos.forEach(function(g){ if(!v[g.nome]){ v[g.nome]=[]; s.push(g.nome); } v[g.nome].push(g.departamento_id); });
  s.sort();
  return s.map(function(n){ return {nome:n, deptos:v[n]}; });
}

/* ===========================================================================
   ESCOPO — o que um perfil alcanca na estrutura de dados
   Modelo: so o que foi marcado explicitamente e guardado (permitido true/false).
   Quem nao tem marca herda do pai. Sem nada em lugar nenhum = nao alcanca.
   "Limitado" nunca e gravado: e o que a tela mostra quando os filhos divergem.
   =========================================================================== */
function chaveEsc(tipo,valor,acao){ return tipo+'|'+valor+'|'+acao; }

function efetivo(no,acao){
  var k=chaveEsc(no.tipo,no.valor,acao);
  if (Object.prototype.hasOwnProperty.call(ESC,k)) return !!ESC[k];
  if (no.pai) return efetivo(no.pai,acao);
  return false;
}
function estadoNo(no,acao){
  var filhos=filhosDe(no);
  if(!filhos.length) return efetivo(no,acao) ? 'p' : 'b';
  var algumP=false, algumB=false;
  (function varrer(n){
    var f=filhosDe(n);
    if(!f.length){ if(efetivo(n,acao)) algumP=true; else algumB=true; return; }
    f.forEach(varrer);
  })(no);
  if(algumP&&algumB) return 'l';
  return algumP ? 'p' : 'b';
}
function filhosDe(no){
  if(no.tipo==='departamento') return gruposDe(no.valor).map(function(g){
    return {tipo:'grupo', valor:g.nome, rotulo:g.nome, pai:no, dep:no.valor}; });
  if(no.tipo==='grupo') return linhasDe(no.dep,no.valor).map(function(l){
    return {tipo:'linha', valor:l.id, rotulo:l.nome, pai:no, dep:no.dep, linha:l}; });
  return [];
}
function limparSubarvore(no,acao){
  filhosDe(no).forEach(function(f){
    delete ESC[chaveEsc(f.tipo,f.valor,acao)];
    limparSubarvore(f,acao);
  });
}
function alternarNo(no,acao){
  registrarHistorico();
  var atual=estadoNo(no,acao);
  var novo = (atual==='p') ? false : true;   /* limitado e bloqueado viram permitido */
  ESC[chaveEsc(no.tipo,no.valor,acao)] = novo;
  limparSubarvore(no,acao);
  recalcularSujo();
  desenhar();
}

/* ---------- telas do modulo (perfil_permissoes) ---------- */
function chavePerm(rid,acao){ return rid+'|'+acao; }
function alternarTela(rid,acaoTela){
  registrarHistorico();
  var k=chavePerm(rid,acaoTela);
  if(PERM[k]) delete PERM[k]; else PERM[k]=true;
  recalcularSujo(); desenhar();
}
function copiarMapa(m){var o={};Object.keys(m||{}).forEach(function(k){o[k]=m[k];});return o;}
function mapasIguais(a,b){
  var ka=Object.keys(a||{}),kb=Object.keys(b||{}); if(ka.length!==kb.length)return false;
  return ka.every(function(k){return Object.prototype.hasOwnProperty.call(b,k)&&a[k]===b[k];});
}
function recalcularSujo(){SUJO=!mapasIguais(PERM,PERM_ORIGINAL)||!mapasIguais(ESC,ESC_ORIGINAL);}
function registrarHistorico(){
  HIST_PERM.push({perm:copiarMapa(PERM),esc:copiarMapa(ESC)});
  if(HIST_PERM.length>20)HIST_PERM.shift();
}
function desfazerPermissoes(){
  var anterior=HIST_PERM.pop(); if(!anterior)return;
  PERM=anterior.perm;ESC=anterior.esc;recalcularSujo();desenhar();
}
function recursosDoModulo(mid){return D.recursos.filter(function(r){return r.id===mid||r.pai_id===mid;});}
function entradasDoModulo(mid,acao){
  var out=[];
  recursosDoModulo(mid).forEach(function(r){
    var disponiveis=acoesDe(r.id);
    var escolhidas=acao?[acao]:disponiveis;
    escolhidas.forEach(function(a){if(disponiveis.indexOf(a)>=0)out.push({rid:r.id,acao:a});});
  });
  return out;
}
function todasPermitidas(entradas){return !!entradas.length&&entradas.every(function(e){return !!PERM[chavePerm(e.rid,e.acao)];});}
function definirEntradas(entradas,permitir){
  registrarHistorico();
  entradas.forEach(function(e){var k=chavePerm(e.rid,e.acao);if(permitir)PERM[k]=true;else delete PERM[k];});
  recalcularSujo();desenhar();
}
function definirModulo(mid,permitir){definirEntradas(entradasDoModulo(mid),permitir);}
function definirColunaModulo(mid,acao,permitir){definirEntradas(entradasDoModulo(mid,acao),permitir);}
function definirLinhaPermissoes(rid,permitir){
  var disp=acoesDe(rid),entradas=COLUNAS_TELAS.filter(function(c){return disp.indexOf(c.tela)>=0;})
    .map(function(c){return {rid:rid,acao:c.tela};});
  definirEntradas(entradas,permitir);
}
function contarAlteracoes(){
  var ad=0,rm=0;
  Object.keys(PERM).forEach(function(k){if(!PERM_ORIGINAL[k])ad++;});
  Object.keys(PERM_ORIGINAL).forEach(function(k){if(!PERM[k])rm++;});
  Object.keys(ESC).forEach(function(k){
    if(!Object.prototype.hasOwnProperty.call(ESC_ORIGINAL,k)||ESC[k]!==ESC_ORIGINAL[k]){if(ESC[k])ad++;else rm++;}
  });
  Object.keys(ESC_ORIGINAL).forEach(function(k){
    if(!Object.prototype.hasOwnProperty.call(ESC,k)){if(ESC_ORIGINAL[k])rm++;else ad++;}
  });
  return {adicionadas:ad,removidas:rm,total:ad+rm};
}

var ACOES_SENSIVEIS=['ver_valores','ver_nomes','ver_valores_individuais','ver_remuneracao'];
function blocoSensiveisUsuario(uid){
  var negadas={};
  (D.excecoes||[]).forEach(function(x){ if(x.usuario_id===uid && !x.permitido) negadas[x.recurso_id+'|'+x.acao]=1; });
  var meus=(D.escopos||[]).filter(function(e){ return e.usuario_id===uid; });
  var depOK={}, grpNao={};
  meus.forEach(function(e){ if(e.tipo==='departamento'&&e.permitido) depOK[e.valor]=1;
                            if(e.tipo==='grupo'&&!e.permitido) grpNao[e.valor]=1; });
  var h='<div class="linha" style="gap:16px;margin-bottom:10px"><b style="font-size:12.5px">Departamentos que pode ver</b>'
       +'<span style="color:var(--tx3);font-size:12px">nenhum marcado = vê todos</span></div><div class="linha" style="gap:14px">';
  D.departamentos.forEach(function(d){
    h+='<label class="linha" style="gap:6px"><input type="checkbox" data-dep="'+esc(d.id)+'"'+(depOK[d.id]?' checked':'')+'> <b>'+esc(d.id)+'</b></label>';
  });
  h+='</div><div class="linha" style="gap:16px;margin:12px 0 8px"><b style="font-size:12.5px">Grupos bloqueados</b>'
    +'<span style="color:var(--tx3);font-size:12px">vale em todos os departamentos onde o grupo existe</span></div><div class="linha" style="gap:14px">';
  gruposDistintos().forEach(function(g){
    h+='<label class="linha" style="gap:6px;min-width:200px"><input type="checkbox" data-grp="'+esc(g.nome)+'"'+(grpNao[g.nome]?' checked':'')+'> '
      + esc(g.nome)+(g.deptos.length>1?' <span class="tag tag-av">'+g.deptos.length+' deptos</span>':'')+'</label>';
  });
  h+='</div><div style="margin:12px 0 8px"><b style="font-size:12.5px">Informações sensíveis</b> '
    +'<span style="color:var(--tx3);font-size:12px">marcado = NÃO vê</span></div>';
  D.recursos.filter(function(r){return !r.pai_id;}).forEach(function(r){
    var acoes=D.acoes.filter(function(a){ return a.recurso_id===r.id && ACOES_SENSIVEIS.indexOf(a.acao)>=0; });
    if(!acoes.length) return;
    h+='<div style="margin-bottom:6px"><div style="font-size:12.5px">'+(r.icone?esc(r.icone)+' ':'')+'<b>'+esc(r.nome)+'</b></div>'
      +'<div class="linha" style="gap:14px;padding-left:14px">';
    acoes.forEach(function(a){
      var k=r.id+'|'+a.acao;
      h+='<label class="linha" style="gap:6px"><input type="checkbox" data-sens="'+esc(k)+'"'+(negadas[k]?' checked':'')+'> '+esc(a.rotulo||a.acao)+'</label>';
    });
    h+='</div></div>';
  });
  return h+'<button class="btn-esm btn-peq" data-salvar-escopo="'+esc(uid)+'" style="margin-top:8px">Salvar exceções desta pessoa</button>';
}

/* ---------- Permissoes (a tela principal) ---------- */
function crachasDe(uid){ return D.vinculos.filter(function(v){ return v.usuario_id===uid; }); }
function pessoasDoPerfil(pid){
  return D.vinculos.filter(function(v){ return v.perfil_id===pid; })
    .map(function(v){ return D.usuarios.filter(function(u){ return u.id===v.usuario_id; })[0]; })
    .filter(Boolean);
}

/* Escolher a pessoa primeiro. Os crachas continuam existindo por tras — sem eles,
   cada pessoa nova obrigaria a remarcar tudo — mas quem trabalha aqui pensa em gente,
   nao em cracha. Por isso a tela abre perguntando "para quem?". */
function blocoEscolhaPessoa(){
  var h = '<div class="card"><h3>Para quem você quer ajustar o acesso?</h3>'
    + '<div style="font-size:12.5px;color:var(--tx2);margin-bottom:14px">Escolha a pessoa. '
    + 'Eu mostro o que ela alcança hoje e você ajusta ali mesmo.</div>'
    + '<table><thead><tr><th>Pessoa</th><th>Crachá</th><th>O que alcança hoje</th><th style="width:1%"></th></tr></thead><tbody>';
  D.usuarios.forEach(function(u){
    var vs = crachasDe(u.id);
    var resumo;
    if(!vs.length) resumo = '<span style="color:var(--tx3)">nada — sem crachá</span>';
    else if(vs.some(function(v){ return ehMestre(v.perfil_id); })) resumo = 'a plataforma inteira';
    else {
      var n = vs.reduce(function(a,v){ return a + ((D.__escPorPerfil&&D.__escPorPerfil[v.perfil_id])||0); }, 0);
      resumo = n ? n + ' marcação(ões) na estrutura' : '<span style="color:var(--tx3)">o crachá ainda não libera nada</span>';
    }
    h += '<tr><td><b>'+esc(u.nome||'(sem nome)')+'</b><div style="color:var(--tx2);font-size:12px">'+esc(u.email)+'</div></td>'
      +  '<td>'+(vs.length ? vs.map(function(v){ return '<span class="tag '+(ehMestre(v.perfil_id)?'tag-mestre':'tag-perfil')+'">'+esc(nomePerfil(v.perfil_id))+'</span>'; }).join('')
                          : '<span style="color:var(--tx3)">—</span>')+'</td>'
      +  '<td>'+resumo+'</td>'
      +  '<td><button class="btn-esm btn-peq" data-pessoa="'+esc(u.id)+'">Ajustar acesso</button></td></tr>';
  });
  h += '</tbody></table>';
  h += '<div style="margin-top:14px;font-size:12.5px;color:var(--tx2)">Não achou a pessoa? Ela precisa existir como '
    +  'usuário primeiro — veja a aba <b>Usuários</b>.</div></div>';
  return h;
}

  if(!PERFIL) PERFIL = (D.perfis[0]||{}).id;
  var p = perfil(PERFIL) || {};
  var h = titulo('🔒','Gestão de Permissões',
        MODO_PERM==='pessoa'
          ? 'Ajustando o acesso de <b>'+esc(u.nome||u.email)+'</b>.'

    + '<div><div class="rotulo">'+(MODO_PERM==='cracha'?'ESCOLHA O CRACHÁ':'USUÁRIO E CRACHÁ EM EDIÇÃO')+'</div>'
    + (MODO_PERM==='cracha'
       ? '<select id="sel-perfil">'+D.perfis.map(function(x){ return '<option value="'+esc(x.id)+'"'+(x.id===PERFIL?' selected':'')+'>'+esc(x.nome)+(x.acesso_total?' — acesso total':'')+'</option>'; }).join('')+'</select>'
       : '<b>'+esc(u.nome||u.email)+' · '+esc(nomePerfil(PERFIL))+'</b>')+'</div>'
    + (MODO_PERM==='pessoa'?'<button class="btn btn-peq espaco" id="bt-trocar-pessoa">Trocar de usuário</button>':'')
    + '<span class="espaco tag '+(p.ativo?'tag-ok':'tag-off')+'">'+(p.ativo?'crachá ativo':'crachá inativo')+'</span></div>';

  h += blocoPassosPermissoes(p);

  if(MODO_PERM==='pessoa' && u){
    var vs2 = crachasDe(u.id);
    var outros = pessoasDoPerfil(PERFIL).filter(function(x){ return x.id!==u.id; });
    h += '<div class="aviso'+(outros.length?'':' bom')+'">'
      +  '<b>'+esc(u.nome||u.email)+'</b> usa o crachá <b>'+esc(nomePerfil(PERFIL))+'</b>'
      +  (vs2.length>1 ? ' (e mais '+(vs2.length-1)+')' : '') + '. '
      +  (outros.length
           ? 'Atenção: este mesmo crachá vale para ' + outros.map(function(x){ return '<b>'+esc(x.nome||x.email)+'</b>'; }).join(', ')
             + '. O que você mudar aqui muda para essas pessoas também. Se a mudança é só para '+esc((u.nome||u.email).split(' ')[0])
             + ', crie um crachá próprio.'
           : 'Hoje ninguém mais usa este crachá, então o que você mudar vale só para ela.')
      +  '</div>';
    if(vs2.length>1){
      h += '<div class="linha" style="margin-bottom:12px"><span style="font-size:12.5px;color:var(--tx2)">Crachá que estou editando:</span>'
        +  vs2.map(function(v){ return '<button class="btn btn-peq" data-usar-cracha="'+esc(v.perfil_id)+'"'
             + (v.perfil_id===PERFIL?' style="border-color:var(--ok);color:var(--ok);font-weight:600"':'')+'>'+esc(nomePerfil(v.perfil_id))+'</button>'; }).join('')
        +  '</div>';
    }
  }

  h += '<div class="abas">'
    +  ['telas|Acessos por Módulo','matriz|Escopo do Orçado','globais|Permissões Especiais','pessoas|Usuários deste Crachá']
       .map(function(a){ var q=a.split('|');
         return '<button data-subaba="'+q[0]+'"'+(SUBABA===q[0]?' class="on"':'')+'>'+q[1]+'</button>'; }).join('')
    +  '</div>';

  if(p.acesso_total){
    return h + '<div class="aviso"><b>Acesso total.</b> Este perfil alcança qualquer recurso da plataforma, '
      + 'inclusive módulos que ainda não existem. Por isso não tem matriz: ela ficaria desatualizada a cada módulo novo.</div>';
  }

  h += '<div class="colunas"><div class="principal">';
  if(SUBABA==='matriz')       h += blocoMatriz();
  else if(SUBABA==='telas')   h += blocoTelas();
  else if(SUBABA==='globais') h += blocoGlobais();
  else                        h += blocoPessoas();
  h += '</div><div class="lado">'+blocoResumo()+blocoAcoesRapidas()+'</div></div>';

  h += '<div class="rodape">'
    +  '<button class="btn" id="bt-cancelar">Cancelar</button>'
    +  '<button class="btn" id="bt-desfazer"'+(HIST_PERM.length?'':' disabled')+'>↶ Desfazer última ação</button>'
    +  '<button class="btn" id="bt-limpar"'+(SUJO?'':' disabled')+'>Descartar alterações</button>'
    +  '<button class="btn-esm" id="bt-salvar"'+(SUJO?'':' disabled')+'>Revisar e salvar →</button></div>';
  return h;
}

function blocoMatriz(){
  if(!D.linhas.length && !D.grupos.length){
    return '<div class="card"><div class="vazio">A estrutura ainda não foi sincronizada. '
         + 'Vá em Configurações → Sincronizar estrutura do Orçado.</div></div>';
  }
  var h = '<div class="card"><div class="filtros">'
    + campoSelect('f-modulo','Módulo', [['','Todos os Módulos']].concat(modulos().map(function(m){return [m.id,m.nome];})), FILTRO.modulo)
    + campoSelect('f-depto','Departamento', [['','Todos os Departamentos']].concat(D.departamentos.map(function(d){return [d.id, d.nome+' ('+d.id+')'];})), FILTRO.depto)
    + campoSelect('f-grupo','Grupo', [['','Todos os Grupos']].concat(gruposDistintos().map(function(g){return [g.nome,g.nome];})), FILTRO.grupo)
    + campoSelect('f-linha','Linha', [['','Todas as Linhas']].concat(D.linhas.slice(0,600).map(function(l){return [l.id, l.id+' — '+l.nome];})), FILTRO.linha)
    + '</div>';

  if(FILTRO.modulo && FILTRO.modulo!=='orcamento'){
    return h + '<div class="vazio">A estrutura de departamentos, grupos e linhas é do Orçado x Realizado. '
      + 'O módulo escolhido ainda não tem estrutura mapeada — no Benefícios, o recorte é por colaborador '
      + 'e centro de custo, e vamos tratá-lo depois.</div></div>';
  }

  h += '<div class="matriz"><table><thead><tr><th>Estrutura</th>'
    +  COLUNAS.map(function(c){ return '<th class="acao">'+c.ico+' '+c.rot+'</th>'; }).join('')
    +  '</tr></thead><tbody>';

  var deps = D.departamentos.filter(function(d){ return !FILTRO.depto || d.id===FILTRO.depto; });
  var achou=false;
  deps.forEach(function(d){
    var no={tipo:'departamento', valor:d.id, rotulo:d.nome+' ('+d.id+')', pai:null};
    var gs=filhosDe(no).filter(function(g){ return !FILTRO.grupo || g.valor===FILTRO.grupo; });
    if(FILTRO.grupo && !gs.length) return;
    achou=true;
    var aberto = ABERTO['d:'+d.id] !== false;
    h += linhaMatriz(no, 0, gs.length, aberto, '📁');
    if(!aberto) return;
    gs.forEach(function(g){
      var ls=filhosDe(g).filter(function(l){ return !FILTRO.linha || l.valor===FILTRO.linha; });
      if(FILTRO.linha && !ls.length) return;
      var abertoG = !!ABERTO['g:'+d.id+'|'+g.valor];
      h += linhaMatriz(g, 1, ls.length, abertoG, '👥');
      if(!abertoG) return;
      ls.forEach(function(l){ h += linhaMatriz(l, 2, 0, false, '·'); });
    });
  });
  if(!achou) h += '<tr><td colspan="5"><div class="vazio">Nada com esses filtros.</div></td></tr>';
  h += '</tbody></table></div>';

  h += '<div class="card" style="margin:14px 0 0"><h3>Legenda de permissões</h3><div class="legenda">'
    +  '<div><b style="color:var(--ok)">＋ Permitido</b>acesso total à funcionalidade</div>'
    +  '<div><b style="color:var(--warn)">— Limitado</b>parte liberada, parte não — há exceções abaixo</div>'
    +  '<div><b style="color:var(--bad)">✕ Bloqueado</b>sem acesso</div>'
    +  '<div><b style="color:var(--tx3)">— Não aplicável</b>a tela não tem essa ação</div>'
    +  '</div><div style="margin-top:10px;font-size:12.5px;color:var(--tx2)">'
    +  'Clicar em um departamento ou grupo vale para tudo que está dentro dele. Para abrir exceção, '
    +  'expanda e clique só no item que deve ser diferente — o pai passa a mostrar <b>Limitado</b>.</div></div>';
  return h+'</div>';
}

function linhaMatriz(no, nivel, qtdFilhos, aberto, ico){
  var chaveAb = no.tipo==='departamento' ? 'd:'+no.valor : (no.tipo==='grupo' ? 'g:'+no.dep+'|'+no.valor : '');
  var seta = qtdFilhos ? '<span class="setinha" data-abrir="'+esc(chaveAb)+'">'+(aberto?'⌄':'›')+'</span>' : '<span class="setinha">&nbsp;</span>';
  var extra = no.tipo==='linha' ? '<span style="color:var(--tx3);font-size:11.5px"> · '+esc(no.valor)+'</span>' : '';
  var h = '<tr class="no'+nivel+'"><td class="est">'+seta+' '+ico+' '+esc(no.rotulo)+extra
        + (qtdFilhos?' <span style="color:var(--tx3);font-size:11.5px">('+qtdFilhos+')</span>':'')+'</td>';
  COLUNAS.forEach(function(c){
    var st=estadoNo(no,c.id);
    var rot = st==='p'?'Permitido':(st==='l'?'Limitado':'Bloqueado');
    h += '<td class="cel"><span class="pill '+st+'" data-no="'+esc(no.tipo)+'|'+esc(no.valor)+'|'+esc(no.dep||'')+'" '
      +  'data-acao="'+c.id+'">'+rot+'</span></td>';
  });
  return h+'</tr>';
}

function blocoTelas(){
  var mods=modulos().filter(function(m){return !FILTRO.moduloTela||m.id===FILTRO.moduloTela;});
  var h='<div class="perm-ajuda"><b>Como usar:</b> clique em uma permissão para marcar individualmente. '
    +'Nos cabeçalhos, use <b>Liberar coluna</b> para marcar a mesma ação em todas as telas daquele módulo. '
    +'Use <b>Liberar módulo inteiro</b> para conceder todas as ações disponíveis, inclusive as permissões especiais daquele módulo.</div>'
    +'<div class="perm-seletor" style="margin-bottom:14px"><div class="campo" style="min-width:260px"><label>MÓDULO PARA CONFIGURAR</label><select id="f-tela-modulo">'
    +'<option value="">Todos os módulos</option>'+modulos().map(function(m){return '<option value="'+esc(m.id)+'"'+(FILTRO.moduloTela===m.id?' selected':'')+'>'+esc(m.nome)+'</option>';}).join('')
    +'</select></div><span style="color:var(--tx2);font-size:12px">Mostrando '+mods.length+' de '+modulos().length+' módulo(s)</span></div>';

  mods.forEach(function(m){
    var entradas=entradasDoModulo(m.id),liberadas=entradas.filter(function(e){return !!PERM[chavePerm(e.rid,e.acao)];}).length;
    var tudo=todasPermitidas(entradas),telas=[m].concat(telasDoModulo(m.id));
    h+='<section class="perm-modulo"><div class="perm-modulo-topo"><h3>'+(m.icone||'▣')+' '+esc(m.nome)+'</h3>'
      +'<span class="contagem"><b>'+liberadas+'</b> de '+entradas.length+' permissões liberadas</span><div class="acoes">'
      +'<button class="btn-esm btn-peq" data-modulo-perm="'+esc(m.id)+'|1"'+(tudo?' disabled':'')+'>✓ Liberar módulo inteiro</button>'
      +'<button class="btn btn-peq" data-modulo-perm="'+esc(m.id)+'|0"'+(!liberadas?' disabled':'')+'>✕ Bloquear módulo</button></div></div>'
      +'<div class="matriz"><table><thead><tr><th>Tela ou função</th>';
    COLUNAS_TELAS.forEach(function(c){
      var col=entradasDoModulo(m.id,c.tela),colTudo=todasPermitidas(col),colLigadas=col.filter(function(e){return !!PERM[chavePerm(e.rid,e.acao)];}).length;
      h+='<th class="acao"><div class="perm-coluna"><span>'+c.ico+' '+esc(c.rot)+'</span>'
        +'<button class="btn" data-coluna-perm="'+esc(m.id)+'|'+esc(c.tela)+'|'+(colTudo?'0':'1')+'"'+(col.length?'':' disabled')+'>'
        +(colTudo?'Bloquear coluna':'Liberar coluna')+'</button><small>'+colLigadas+'/'+col.length+'</small></div></th>';
    });
    h+='<th class="acao">Todas da linha</th></tr></thead><tbody>';
    telas.forEach(function(t,idx){
      var disp=acoesDe(t.id),linha=COLUNAS_TELAS.filter(function(c){return disp.indexOf(c.tela)>=0;}).map(function(c){return {rid:t.id,acao:c.tela};});
      var linhaTudo=todasPermitidas(linha);
      h+='<tr class="no'+(idx?1:0)+'"><td class="est">'+(t.icone||(idx?'·':'▣'))+' '+esc(t.nome)+(idx?'':' <span class="tag tag-perfil">entrada do módulo</span>')+'</td>';
      COLUNAS_TELAS.forEach(function(c){
        if(disp.indexOf(c.tela)<0){h+='<td class="cel"><span class="pill n">—</span></td>';return;}
        var on=!!PERM[chavePerm(t.id,c.tela)];
        h+='<td class="cel"><button class="perm-check'+(on?' on':'')+'" data-tela="'+esc(t.id)+'|'+esc(c.tela)+'" aria-pressed="'+(on?'true':'false')+'">'
          +'<span class="box">'+(on?'✓':'')+'</span>'+(on?'Permitido':'Bloqueado')+'</button></td>';
      });
      h+='<td class="cel"><button class="btn btn-peq perm-todas" data-linha-perm="'+esc(t.id)+'|'+(linhaTudo?'0':'1')+'"'+(linha.length?'':' disabled')+'>'
        +(linhaTudo?'Bloquear':'Liberar todas')+'</button></td></tr>';
    });
    h+='</tbody></table></div></section>';
  });
  return h;
}

function carregarPerfil(pid){
  PERFIL=pid; PERM={}; ESC={}; PERM_ORIGINAL={}; ESC_ORIGINAL={}; HIST_PERM=[]; SUJO=false;
  return Promise.all([
    api('perfil_permissoes?select=recurso_id,acao,permitido&perfil_id=eq.'+encodeURIComponent(pid)),
    api('perfil_escopos?select=tipo,valor,acao,permitido&perfil_id=eq.'+encodeURIComponent(pid))
  ]).then(function(r){
    r[0].forEach(function(x){ if(x.permitido) PERM[chavePerm(x.recurso_id,x.acao)]=true; });
    r[1].forEach(function(x){ ESC[chaveEsc(x.tipo,x.valor,x.acao)] = !!x.permitido; });
    PERM_ORIGINAL=copiarMapa(PERM); ESC_ORIGINAL=copiarMapa(ESC);
    desenhar();
  });
}

/* ---------- sincronismo com o plano do Orcado ---------- */
function sincronizarEstrutura(){
  var log=$('sync-log');
  log.textContent='Lendo o plano do módulo Orçado x Realizado…';
  return fetch('/orcado/', {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(txt){
    var i=txt.indexOf('<script id="db" type="application/json">');
    if(i<0) throw new Error('Não encontrei o plano dentro do módulo.');
    var ini=txt.indexOf('>',i)+1, fim=txt.indexOf('</'+'script>', ini);
    var db=JSON.parse(txt.slice(ini,fim));
    var linhas=db.lines||[];
    if(!linhas.length) throw new Error('O plano veio vazio.');

    var deps={}, grupos={}, regs=[];
    linhas.forEach(function(l){
      var dep=l.area, gr=l.g||'(sem grupo)';
      deps[dep]=1;
      grupos[dep+'|'+gr]=1;
      regs.push({ id:String(l.id), departamento_id:dep, grupo_nome:gr, nome:String(l.n||''),
                  cod:String(l.cod||''), origem:'plano' });
    });
    var depsBody=Object.keys(deps).map(function(d,i){
      var ja=D.departamentos.filter(function(x){return x.id===d;})[0];
      return { id:d, nome: ja?ja.nome:d, ativo:true, ordem: ja?ja.ordem:(50+i) };
    });
    var gruposBody=Object.keys(grupos).map(function(k){
      var p=k.split('|');
      return { id: slug(p[0]+' '+p[1]), departamento_id:p[0], nome:p[1], ativo:true };
    });
    log.textContent='Encontrei '+regs.length+' linhas em '+gruposBody.length+' grupos. Gravando…';
    return api('departamentos?on_conflict=id',{method:'POST',body:depsBody,prefer:'resolution=merge-duplicates,return=minimal'})
      .then(function(){ return api('grupos?on_conflict=id',{method:'POST',body:gruposBody,prefer:'resolution=merge-duplicates,return=minimal'}); })
      .then(function(){
        var lote=[], p=Promise.resolve();
        for(var i2=0;i2<regs.length;i2+=200) lote.push(regs.slice(i2,i2+200));
        lote.forEach(function(parte){
          p = p.then(function(){ return api('linhas?on_conflict=id',{method:'POST',body:parte,prefer:'resolution=merge-duplicates,return=minimal'}); });
        });
        return p;
      })
      .then(recarregar)
      .then(function(){
        log.innerHTML='<b style="color:var(--ok)">Pronto.</b> '+depsBody.length+' departamentos, '
          + gruposBody.length+' grupos e '+regs.length+' linhas sincronizados.';
      });
  }).catch(function(e){ log.innerHTML='<b style="color:var(--bad)">Não deu certo:</b> '+esc(e.message); });
}

function exportarPermissoes(){
  var linhas=[['perfil','tipo','item','acao','permitido']];

  }
  if(t.dataset.revogar){
    var r2=t.dataset.revogar.split('|');
    comErro(api('usuario_perfis?usuario_id=eq.'+r2[0]+'&perfil_id=eq.'+encodeURIComponent(r2[1]),{method:'DELETE'})
      .then(recarregar).then(function(){ banner('<b>Perfil revogado.</b>','bom'); }),'revogar o perfil').then(null,function(){});
    return;
  }
  if(t.dataset.salvarUser){
    var u3=t.dataset.salvarUser;
    var nomeU=$('un-'+u3).value.trim(),emailU=$('ue-'+u3).value.trim().toLowerCase();
    if(!nomeU||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailU)){alert('Revise o nome e o e-mail.');return;}
    comErro(gerenciarUsuario('editar',{usuario_id:u3,nome:nomeU,email:emailU,
      ativo:$('ua-'+u3).checked,bloqueado:$('ub-'+u3).checked,valido_ate:$('uv-'+u3).value||null})
      .then(recarregar).then(function(){ banner('<b>Usuário atualizado.</b>','bom'); }),'salvar o usuário').then(null,function(){});
    return;
  }
  if(t.dataset.excluirUser){
    var uidX=t.dataset.excluirUser,uX=D.usuarios.filter(function(x){return x.id===uidX;})[0]; if(!uX)return;
    if(uidX===SES.user_id||uidX===(SES.user&&SES.user.id)){alert('Você não pode excluir o próprio acesso enquanto está conectado.');return;}
    var confirma=prompt('Para excluir o acesso de '+(uX.nome||uX.email)+', digite o e-mail completo:\n'+uX.email);
    if(String(confirma||'').trim().toLowerCase()!==String(uX.email||'').trim().toLowerCase()){if(confirma!==null)alert('O e-mail não confere.');return;}
    comErro(gerenciarUsuario('excluir',{usuario_id:uidX,confirmacao_email:confirma})
      .then(recarregar).then(function(){banner('<b>Acesso excluído.</b> A ação foi registrada para auditoria.','bom');}),
      'excluir o usuário').then(null,function(){});
    return;
  }
  if(t.dataset.salvarEscopo){
    var uid4=t.dataset.salvarEscopo, deps=[], grps=[], sens=[];
    document.querySelectorAll('[data-dep]').forEach(function(c){ if(c.checked) deps.push(c.getAttribute('data-dep')); });
    document.querySelectorAll('[data-grp]').forEach(function(c){ if(c.checked) grps.push(c.getAttribute('data-grp')); });
    document.querySelectorAll('[data-sens]').forEach(function(c){ if(c.checked) sens.push(c.getAttribute('data-sens')); });
    var escopos=deps.map(function(d){ return {usuario_id:uid4,tipo:'departamento',valor:d,permitido:true}; })
      .concat(grps.map(function(g){ return {usuario_id:uid4,tipo:'grupo',valor:g,permitido:false}; }));
    var exc=sens.map(function(k){ var q=k.split('|');
      return {usuario_id:uid4,recurso_id:q[0],acao:q[1],permitido:false,justificativa:'Acesso a Informações'}; });
    comErro(api('usuario_escopos?usuario_id=eq.'+uid4,{method:'DELETE'})
      .then(function(){ return escopos.length?api('usuario_escopos',{method:'POST',body:escopos,prefer:'return=minimal'}):null; })
      .then(function(){ return api('usuario_permissoes?usuario_id=eq.'+uid4+'&acao=in.('+ACOES_SENSIVEIS.join(',')+')',{method:'DELETE'}); })
      .then(function(){ return exc.length?api('usuario_permissoes',{method:'POST',body:exc,prefer:'return=minimal'}):null; })
      .then(recarregar).then(function(){ banner('<b>Exceções salvas.</b> Ainda não aplicadas pelos módulos.','bom'); }),
      'salvar as exceções').then(null,function(){});
    return;
  }

  if(t.id==='bt-salvar'){ modalRevisarPermissoes(); return; }
  if(t.id==='bt-desfazer'){desfazerPermissoes();return;}
  if(t.id==='bt-cancelar' || t.id==='bt-limpar'){ carregarPerfil(PERFIL); return; }
  if(t.id==='bt-sair'){ sair(); return; }
  if(t.id==='bt-sync'){ t.disabled=true; sincronizarEstrutura().then(function(){ t.disabled=false; }); return; }
  if(t.id==='bt-backup'){ gerarBackup(); return; }
  if(t.id==='bt-exportar-perm'){ exportarPermissoes(); return; }
  if(t.id==='bt-recarregar-logs'){
    api('activity_log?select=created_at,actor,action,details&order=created_at.desc&limit=200')
      .then(function(r){ D.logs=r; desenhar(); }); return;
  }
  if(t.id==='bt-zerar'){
    if(!confirm('Voltar tudo para bloqueado neste perfil? Só vale depois de Salvar.')) return;
    registrarHistorico();PERM={};ESC={};recalcularSujo();desenhar();return;
  }
  if(t.id==='bt-clonar'){
    var destino=prompt('Copiar as permissões de "'+nomePerfil(PERFIL)+'" para qual perfil? Digite o identificador.\n\n'
      + D.perfis.filter(function(p){return p.id!==PERFIL;}).map(function(p){return p.id+' — '+p.nome;}).join('\n'));
    if(!destino) return;
    if(!perfil(destino)){ alert('Não existe perfil com esse identificador.'); return; }
    var permB=Object.keys(PERM).map(function(k){ var q=k.split('|'); return {perfil_id:destino,recurso_id:q[0],acao:q[1],permitido:true}; });
    var escB=Object.keys(ESC).map(function(k){ var q=k.split('|'); return {perfil_id:destino,tipo:q[0],valor:q[1],acao:q[2],permitido:!!ESC[k]}; });
    comErro(api('perfil_permissoes?perfil_id=eq.'+encodeURIComponent(destino),{method:'DELETE'})
      .then(function(){ return permB.length?api('perfil_permissoes',{method:'POST',body:permB,prefer:'return=minimal'}):null; })
      .then(function(){ return api('perfil_escopos?perfil_id=eq.'+encodeURIComponent(destino),{method:'DELETE'}); })
      .then(function(){ return escB.length?api('perfil_escopos',{method:'POST',body:escB,prefer:'return=minimal'}):null; })
      .then(recarregar).then(function(){ banner('<b>Permissões copiadas para '+esc(nomePerfil(destino))+'.</b>','bom'); }),
      'clonar as permissões').then(null,function(){});
    return;
  }
  if(t.id==='bt-novo-perfil' || t.id==='bt-novo-perfil2' || t.id==='bt-novo-perfil3'){
    NOVO_PERFIL_PARA=(t.id==='bt-novo-perfil3'&&MODO_PERM==='pessoa')?PESSOA:null;
    modalPerfil(null); return;
  }
});

document.addEventListener('change', function(ev){
  var t=ev.target;
  if(t.id==='sel-perfil'){
    if(SUJO&&!confirm('Há alterações não salvas neste crachá. Trocar e descartá-las?')){desenhar();return;}
    carregarPerfil(t.value);return;
  }
  if(t.id==='f-modulo'){ FILTRO.modulo=t.value; desenhar(); return; }
  if(t.id==='f-tela-modulo'){ FILTRO.moduloTela=t.value; desenhar(); return; }
  if(t.id==='f-depto'){ FILTRO.depto=t.value; FILTRO.grupo=''; FILTRO.linha=''; desenhar(); return; }
  if(t.id==='f-grupo'){ FILTRO.grupo=t.value; FILTRO.linha=''; desenhar(); return; }
  if(t.id==='f-linha'){ FILTRO.linha=t.value; desenhar(); return; }
  if(t.id==='so-ativos'){ window.__soAtivos=t.checked; desenhar(); return; }
  if(t.dataset && t.dataset.sensivel){
    var id=t.dataset.sensivel, v=t.checked;
    comErro(api('linhas?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{sensivel:v},prefer:'return=minimal'})
      .then(function(){ var l=D.linhas.filter(function(x){return x.id===id;})[0]; if(l) l.sensivel=v; }),
      'marcar a linha').then(null,function(){});
    return;
  }
});
document.addEventListener('input', function(ev){
  var t=ev.target;
  if(t.id==='busca-user'){ window.__busca=t.value; var p=t.selectionStart; desenhar();
    var n=$('busca-user'); if(n){ n.focus(); n.setSelectionRange(p,p); } return; }
  if(t.id==='busca-linha'){ window.__buscaLinha=t.value; var p2=t.selectionStart; desenhar();
    var n2=$('busca-linha'); if(n2){ n2.focus(); n2.setSelectionRange(p2,p2); } return; }
});
window.addEventListener('beforeunload', function(e){ if(SUJO){ e.preventDefault(); e.returnValue=''; } });

/* ---------- arranque ---------- */
function abrirPainel(modo){
  MODO=modo;
  $('capa').style.display='none';
  $('app').style.display='block';   /* '' cairia no display:none do CSS */
  $('hd-nome').textContent=(ACESSO.usuario&&ACESSO.usuario.nome)||SES.email||'—';
  $('hd-papel').textContent= modo==='mestre'?'Administrador Mestre':(modo==='delegado'?'Administração delegada':'Modo de implantação');
  return recarregar().then(function(){ return carregarPerfil((D.perfis[0]||{}).id); });
}
function iniciar(){
  msg('Verificando permissões…');
  return verificarAcesso().then(function(r){
    if(!r.ok){
      var conta=(SES&&SES.email)||(ACESSO&&ACESSO.usuario&&ACESSO.usuario.email)||'desconhecida';
      $('capa-form').innerHTML='<div style="font-size:12.5px;color:#9FB0C7;margin-bottom:12px;line-height:1.55">'
        +'Você está conectado como <b style="color:var(--gold)">'+esc(conta)+'</b>.<br>'
        +'Se essa não é a conta certa, saia do módulo e entre com a conta de administrador.</div>'
        +'<a href="/orcado/"><button class="btn" style="margin-bottom:8px">Ir para o Orçado x Realizado</button></a>'
        +'<a href="/beneficios/"><button class="btn">Ir para a Gestão de Benefícios</button></a>';
      msg(r.motivo,true); return;
    }
    return abrirPainel(r.modo);
  }).catch(function(e){ msg('Falha ao verificar o acesso: '+e.message,true); });
}

fetch('/api/config').then(function(r){ return r.json(); }).then(function(c){
  CFG=c;
  if(!CFG||!CFG.SUPABASE_URL||!CFG.SUPABASE_KEY) throw new Error('Configuração do Supabase indisponível.');
  SES=lerSessaoGuardada();
  if(SES) return iniciar();
  precisaEntrarNoModulo();
}).catch(function(e){
  $('capa-form').style.display='none';
  msg('Não foi possível iniciar: '+e.message,true);
});
</script>
