<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1930">
  <title>Painel LNB — sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(232,185,60,.12),transparent 30%),linear-gradient(160deg,#071326,#0a1930 60%,#071020);color:#eaf0fa;font-family:Segoe UI,Arial,sans-serif}.card{width:min(420px,100%);padding:30px;border:1px solid rgba(232,185,60,.35);border-radius:22px;background:rgba(255,255,255,.04);box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}.mark{width:78px;height:78px;margin:0 auto 20px;border:2px solid #e8b93c;border-radius:50%;display:grid;place-items:center;color:#e8b93c;font-size:34px}h1{margin:0 0 10px;font-size:24px}p{margin:0 0 22px;color:#b9c6d9;line-height:1.55}button{min-height:46px;width:100%;border:0;border-radius:11px;background:linear-gradient(135deg,#e8b93c,#b98213);color:#071326;font:800 14px Segoe UI,Arial,sans-serif;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark" aria-hidden="true">↻</div><h1>Você está sem conexão</h1><p>Por segurança, dados e páginas autenticadas do Painel LNB não ficam armazenados no aparelho. Reconecte-se para continuar.</p><button type="button" onclick="location.reload()">Tentar novamente</button></main></body>
</html>
