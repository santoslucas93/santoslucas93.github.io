<!--
  ============================================================================
  SCRIPT DE ALTERAÇÃO — NÃO APLICADO / NÃO PUBLICADO
  ============================================================================
  Este arquivo é uma PROPOSTA de substituição para colaboradores/index.html.
  Ninguém executou nada em staging ou produção — é só o código pronto para
  o Lucas revisar e, se aprovar, publicar seguindo o fluxo normal (staging
  primeiro, depois produção).

  O QUE MUDOU EM RELAÇÃO AO ARQUIVO ORIGINAL:

  1) FILTROS NOVOS na Central de Colaboradores:
     - Departamento (lista fixa: SUP/COM/MKT/TOP/A&F/ARB, os mesmos 6 códigos
       já usados no rótulo da tabela)
     - Tipo de contratação (montado dinamicamente a partir dos valores que
       já existem na base — evita filtro "vazio" por causa de maiúsculas/
       minúsculas diferentes do que eu imaginei)
     - Centro de Custo (idem, montado a partir dos valores reais)
     - Cesta Básica (elegível / não elegível) — sugestão minha, já que existe
       uma coluna inteira dedicada a isso na tabela
     - Consistência contábil (sugestão de analista financeiro — ver item 4)
     - Botão "Limpar filtros"

  2) POP-UP DE EDIÇÃO ao clicar no nome do colaborador:
     - Quem tem permissão de editar (PODE_EDITAR) agora vê um formulário,
       não só texto. Dá para alterar Centro de Custo, Departamento, Tipo de
       contratação, Status, Observações e a Cesta Básica.
     - Quando o colaborador está ligado ao RH-Folha (rh_colaborador_id
       preenchido), também dá para editar E-mail, Telefone e os 4
       benefícios de opção (Vale Transporte, VR/VA, Plano de Saúde, Seguro
       de Vida) — que hoje só apareciam como "selo", sem forma de mudar.
     - IMPORTANTE (ver aviso no topo do <script>): a escrita dos benefícios
       vai para a tabela rh_colaboradores, que este módulo nunca gravou
       antes. Preciso que isso seja testado em staging antes de ir para
       produção — se a permissão (RLS) do perfil "Benefícios · editar" não
       cobrir UPDATE em rh_colaboradores, o toast vai mostrar o erro exato
       na hora (em vez de falhar calado), e ainda assim o resto do
       formulário (Centro de Custo, Departamento etc.) é salvo normalmente.
     - Nome, CPF e Data de nascimento continuam somente leitura de propósito:
       esses dados vêm do RH-Folha (ou de outra origem) e editá-los aqui
       criaria divergência com a fonte oficial. Quem precisar corrigir isso
       deve mexer na origem (RH & Folha ou Cadastro/Importação de
       Benefícios).
     - Fechar com Esc ou clicando fora do pop-up (não existia antes).

  3) MÓDULO GRANDE "CADASTRO DE COLABORADORES" REMOVIDO DA TELA INICIAL:
     Isso é feito em outro arquivo (ver index_HUB_proposta.html e
     README_MUDANCAS.md, que venho junto). Aqui na Central de Colaboradores
     não muda nada relacionado a isso.

  4) "ALGO MAIS" QUE ACHEI INTERESSANTE (pensando como dev + analista
     financeiro/contábil sênior):
     a) Aviso de inconsistência contábil: se o Departamento for Arbitragem
        mas o Centro de Custo não for 400213 (ou vice-versa: CC 400213 com
        outro departamento), aparece um selo de alerta na linha e no
        pop-up. Isso é exatamente o tipo de erro que citam no guia do
        painel (conta 053917 / CC 400213 = Arbitragem) e que hoje só
        aparece quando alguém já fechou a folha.
     b) Conta contábil de referência: no pop-up, mostro a conta sugerida
        (053671 PJ · 057061 CLT/Estagiário · 053917 Arbitragem) como
        informação — não como campo editável, e com aviso de que é só
        referência (a conta oficial de cada benefício é definida dentro do
        módulo de Benefícios).
     c) Log de auditoria: toda edição (individual ou em lote) agora grava
        um registro em activity_log (mesma tabela que Admin e Orçado x
        Realizado já usam), com o nome de quem alterou, o campo e o valor
        antes/depois. Hoje as ações em lote (Editar CC, Cesta Básica,
        Desligar) não deixavam rastro nenhum — importante para conciliação
        e para auditoria.
     d) Exportar CSV: exporta exatamente a lista filtrada na tela (mesmas
        colunas + conta contábil de referência), pronta para levar para o
        financeiro/contabilidade sem reconstruir a planilha na mão.
     e) Contador de filtros ativos no resumo, para saber rápido se está
        vendo a base inteira ou uma fatia.

  NADA foi publicado. Este arquivo só existe aqui, no ambiente de trabalho
  do Claude, aguardando revisão.
  ============================================================================

  RODADA 2 — pedidos após o primeiro teste em staging:

  5) AÇÕES EM MASSA NOVAS: Ativar em Massa (faltava, só tinha Desligar),

     Alterar Benefícios em massa (Cesta Básica, Vale Transporte, VR/VA,
     Assistência Médica/Plano de Saúde, Seguro de Vida — cada um com
     Ligar / Desligar / Não alterar, para poder mudar só o que precisa).

  6) PREMISSA DE AUTONOMIA (regra permanente, guardada em memória para todo
     trabalho futuro no painel): nada pode ficar fixo no código se depender
     de decisão de negócio que muda com o tempo. Por isso, Departamentos,
     Tipos de contratação, a regra "Centro de Custo começando com 8 vai para
     o departamento Projetos" e a definição de Arbitragem (conta contábil +
     centro de custo) agora vêm de uma tela própria — botão "⚙ Regras",
     visível só para quem edita — e ficam salvas no banco (tabela ben_state,
     mesma que o módulo de Benefícios já usa para guardar configuração,
     chave "colaboradores_regras"). Se a linha ainda não existir no banco,
     o sistema usa os valores de hoje como padrão e funciona normalmente;
     só passa a ler do banco depois que alguém salvar pela tela de Regras.
     Isso significa que adicionar um departamento novo, mudar a conta da
     Arbitragem ou criar uma regra de Centro de Custo não precisa mais de
     mim mexendo no código — é só abrir "⚙ Regras" e salvar.
-->

<script>
/*
  AVISO DE ESCRITA EM rh_colaboradores
  -------------------------------------
  Este módulo, até hoje, só grava em `colaboradores_master`. A edição de
  E-mail, Telefone e dos 4 benefícios de opção (opta_vale_transporte,
  opta_vr_va, opta_plano_saude, opta_seguro_vida) manda um PATCH para
  `rh_colaboradores`, tabela que este módulo nunca escreveu antes.

  Antes de publicar em produção, valide em staging:
    1) Um usuário com perfil "Benefícios · editar" consegue mesmo dar PATCH
       em rh_colaboradores (RLS liberando esse UPDATE para esse papel)?
    2) O PATCH está restrito só às 4 colunas opta_* + email/telefone, e não
       toca em salário, cargo, admissão etc. (o código abaixo já limita a
       isso, mas vale conferir no Network do navegador).
  Se o teste falhar (RLS bloqueando), o toast mostra a mensagem de erro
  exata devolvida pelo Supabase — não falha silenciosamente — e o resto do
  formulário (dados em colaboradores_master) continua sendo salvo.
  Se preferir travar essa parte até confirmar a permissão, basta trocar a
  linha abaixo para false.
*/
const PERMITIR_EDITAR_BENEFICIOS_RH = true;

const SUPABASE_URL = 'https://iiheewndotcwqntppjrw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_h2cw5HY-fJk4rtE5sr8-vQ_TOOT8qkz';

let AUTH_SESSION = null;
let COLABORADORES = [];
let SELECIONADOS = new Set();
let PODE_EDITAR = false;

// ---------- Regras de negócio configuráveis (premissa: autonomia) ----------
// Nada aqui deveria precisar de alteração de código para mudar. Isto é só
// o valor padrão (igual ao que já existia fixo antes) — quem tem permissão
// de editar pode mudar tudo isto pela tela "⚙ Regras", que grava em
// ben_state (chave "colaboradores_regras") e passa a valer sem deploy novo.
const REGRAS_PADRAO = {
  departamentos: [
    {codigo:'1', nome:'Superintendência'},
    {codigo:'2', nome:'Comunicação'},
    {codigo:'3', nome:'Marketing'},
    {codigo:'4', nome:'Técnico Operacional'},
    {codigo:'5', nome:'Administrativo e Financeiro'},
    {codigo:'6', nome:'Arbitragem'},
    {codigo:'7', nome:'Projetos'}
  ],
  tipos_contratacao: ['PJ','CLT','ESTAGIÁRIO','ARBITRAGEM'],
  // Regras de sugestão/consistência: Centro de Custo iniciado com este
  // prefixo deveria estar no departamento indicado.
  regras_cc_departamento: [
    {prefixo:'8', departamento:'7'}
  ],
  // Arbitragem = esta conta contábil + este centro de custo, só existe
  // dentro do benefício indicado (hoje: Seguro de Vida).
  arbitragem: {conta:'053917', centro_custo:'400213', departamento:'6', beneficio:'Seguro de Vida'}
};
let REGRAS = JSON.parse(JSON.stringify(REGRAS_PADRAO));
let REGRAS_VEM_DO_BANCO = false;

async function carregarRegrasAsync(){
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/ben_state?select=valor&chave=eq.colaboradores_regras', {
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+AUTH_SESSION.access_token}
    });
    if (r.ok){
      const arr = await r.json();
      if (arr && arr[0] && arr[0].valor){
        REGRAS = Object.assign({}, REGRAS_PADRAO, arr[0].valor);
        REGRAS_VEM_DO_BANCO = true;
      }
    }
  }catch(e){ /* segue com os valores padrão */ }
}

async function salvarRegrasAsync(regras){
  const r = await fetch(SUPABASE_URL+'/rest/v1/ben_state?on_conflict=chave', {
    method:'POST',
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+AUTH_SESSION.access_token,
      'Content-Type':'application/json',
      'Prefer':'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify([{chave:'colaboradores_regras', valor: regras}])
  });
  if (!r.ok){
    const txt = await r.text().catch(function(){ return ''; });
    throw new Error('Falha ao salvar as Regras ('+r.status+'): '+txt);
  }
}

function sugerirDepartamentoPorCc(cc){
  const norm = String(cc||'').trim();
  if (!norm) return null;
  const regra = (REGRAS.regras_cc_departamento||[]).filter(function(r){ return r.prefixo && norm.indexOf(r.prefixo) === 0; })[0];
  return regra ? regra.departamento : null;
}

function lnbLoadSession(){
  try{ const raw = localStorage.getItem('lnb_auth_session_v1'); if (raw) AUTH_SESSION = JSON.parse(raw); }
  catch(e){ AUTH_SESSION = null; }
}

async function lnbMeuAcessoCentral(){
  if (!AUTH_SESSION || !AUTH_SESSION.access_token) return null;
  try{

      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+AUTH_SESSION.access_token,'Content-Type':'application/json'},
      body:'{}'
    });
    if (!r.ok) return null;

function lnbTemModulo(acesso, recurso){
  if (!acesso) return false;
  if (acesso.acesso_total || acesso.permissoes === '*') return true;
  const acts = (acesso.permissoes || {})[recurso] || [];
  if (Array.isArray(acts) && acts.indexOf('visualizar') >= 0) return true;
  return false;
}

async function lnbTemPermissaoAsync(recurso, acao){
  if (!AUTH_SESSION || !AUTH_SESSION.access_token) return false;
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/rpc/tem_permissao', {
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+AUTH_SESSION.access_token,'Content-Type':'application/json'},
      body: JSON.stringify({p_recurso:recurso, p_acao:acao})
    });
    if (!r.ok) return false;
    return (await r.json()) === true;
  }catch(e){ return false; }
}

// ---------- Regra de negócio: Arbitragem = conta 053917 / CC 400213 ----------
// Mesma lógica de benIsArbitragem() do módulo de Benefícios, adaptada para
// os campos que existem em colaboradores_master (departamento + centro_custo).
function ccNormalizado(v){ return String(v||'').replace(/\D/g,''); }
function inconsistenciaContabil(c){
  const arb = REGRAS.arbitragem || REGRAS_PADRAO.arbitragem;
  const cc = ccNormalizado(c.centro_custo);
  const ehDeptoArb = c.departamento === arb.departamento;
  const ehCcArb = cc === ccNormalizado(arb.centro_custo);
  if (ehDeptoArb && !ehCcArb) return 'Departamento é Arbitragem, mas o Centro de Custo não é '+arb.centro_custo+'.';
  if (ehCcArb && !ehDeptoArb) return 'Centro de Custo é '+arb.centro_custo+' (Arbitragem), mas o Departamento não está marcado como Arbitragem.';
  const sugestao = sugerirDepartamentoPorCc(c.centro_custo);
  if (sugestao && c.departamento && sugestao !== c.departamento){
    return 'Pela regra de Centro de Custo (⚙ Regras), o Departamento sugerido é "'+rotuloDepartamento(sugestao)+'", mas está marcado como "'+rotuloDepartamento(c.departamento)+'".';
  }
  return null;
}
function contaContabilReferencia(c){
  const arb = REGRAS.arbitragem || REGRAS_PADRAO.arbitragem;
  if (c.departamento === arb.departamento || ccNormalizado(c.centro_custo) === ccNormalizado(arb.centro_custo)) return arb.conta+' (Arbitragem)';
  const tipo = String(c.tipo_contratacao||'').toUpperCase();
  if (tipo.indexOf('PJ') >= 0) return '053671 (PJ)';
  if (tipo.indexOf('CLT') >= 0 || tipo.indexOf('ESTAGI') >= 0) return '057061 (CLT/Estagiário)';
  return '— (defina o Tipo de contratação para sugerir)';
}

function renderTabela(){
  const busca = document.getElementById('f-busca').value.trim().toLowerCase();
  const fStatus = document.getElementById('f-status').value;
  const fOrigem = document.getElementById('f-origem').value;
  const fDepto = document.getElementById('f-departamento').value;
  const fTipo = document.getElementById('f-tipo').value;
  const fCc = document.getElementById('f-cc').value;
  const fCesta = document.getElementById('f-cesta').value;
  const fConsist = document.getElementById('f-consistencia').value;
  const corpo = document.getElementById('corpo-tabela');
  corpo.innerHTML = '';

  const filtrados = COLABORADORES.filter(function(c){
    if (fStatus && c.status !== fStatus) return false;
    if (fOrigem && c.origem_fonte !== fOrigem) return false;
    if (fDepto && c.departamento !== fDepto) return false;
    if (fTipo && (c.tipo_contratacao||'') !== fTipo) return false;
    if (fCc && (c.centro_custo||'') !== fCc) return false;
    if (fCesta === 'sim' && !c.is_cesta_basica_elegivel) return false;
    if (fCesta === 'nao' && c.is_cesta_basica_elegivel) return false;
    if (fConsist === 'alerta' && !inconsistenciaContabil(c)) return false;
    if (busca){
      const alvo = ((c.nome||'') + ' ' + (c.cpf||'')).toLowerCase();
      if (alvo.indexOf(busca) === -1) return false;
    }
    return true;
  });

  const filtrosAtivos = [fStatus,fOrigem,fDepto,fTipo,fCc,fCesta,fConsist,busca].filter(Boolean).length;
  document.getElementById('resumo-contagem').textContent =
    filtrados.length + ' de ' + COLABORADORES.length + ' colaboradores' +
    (filtrosAtivos ? ' · ' + filtrosAtivos + ' filtro(s) ativo(s)' : '');

  filtrados.forEach(function(c){
    const tr = document.createElement('tr');
    if (SELECIONADOS.has(c.id)) tr.className = 'selecionada';
    const alerta = inconsistenciaContabil(c);
    tr.innerHTML =
      '<td><input type="checkbox" class="chk-linha" data-id="'+c.id+'" '+(SELECIONADOS.has(c.id)?'checked':'')+'></td>'+
      '<td><button type="button" class="link-nome" data-id="'+c.id+'">'+escapeHtml(c.nome||'(sem nome)')+'</button></td>'+
      '<td>'+escapeHtml(c.cpf||'—')+'</td>'+
      '<td>'+escapeHtml(c.centro_custo||'—')+'</td>'+
      '<td>'+escapeHtml(c.departamento ? rotuloDepartamento(c.departamento) : '—')+(alerta?'<span class="alerta-pill" title="'+escapeHtml(alerta)+'">⚠ conferir</span>':'')+'</td>'+
      '<td>'+escapeHtml(c.tipo_contratacao||'—')+'</td>'+
      '<td><span class="status-pill '+(c.status==='Ativo'?'status-ativo':'status-desligado')+'">'+c.status+'</span></td>'+
      '<td><span class="origem-pill">'+rotuloOrigem(c.origem_fonte)+'</span></td>'+
      '<td><label class="cesta-toggle"><input type="checkbox" class="chk-cesta" data-id="'+c.id+'" '+(c.is_cesta_basica_elegivel?'checked':'')+' '+(PODE_EDITAR?'':'disabled')+'><span class="cesta-slider"></span></label></td>';
    corpo.appendChild(tr);
  });

  document.querySelectorAll('.chk-linha').forEach(function(chk){
    chk.addEventListener('change', function(){
      const id = chk.getAttribute('data-id');
      if (chk.checked) SELECIONADOS.add(id); else SELECIONADOS.delete(id);
      renderTabela();
      atualizarBarraFlutuante();
    });
  });
  document.querySelectorAll('.chk-cesta').forEach(function(chk){
    chk.addEventListener('change', function(){
      const id = chk.getAttribute('data-id');
      atualizarCestaBasicaAsync([id], chk.checked);
    });
  });

  document.querySelectorAll('.link-nome').forEach(function(btn){
    btn.addEventListener('click', function(){
      const id = btn.getAttribute('data-id');
      const c = COLABORADORES.find(function(x){ return x.id === id; });
      if (c) abrirDetalhesColaborador(c);
    });
  });
}

function rotuloOrigem(origem){
  return { rh_folha:'RH-Folha', beneficios_liga_mestre:'Benefícios (PJ)', ambos:'RH + Benefícios', manual:'Manual' }[origem] || origem;
}
function rotuloDepartamento(cod){
  const dep = (REGRAS.departamentos||[]).filter(function(d){ return d.codigo === cod; })[0];
  return dep ? dep.nome : cod;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

function formatDataBR(iso){
  if (!iso) return '—';
  const p = String(iso).split('-');
  if (p.length !== 3) return String(iso);
  return p[2].slice(0,2) + '/' + p[1] + '/' + p[0];
}
function formatMoeda(v){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (isNaN(n)) return '—';
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function chipBeneficio(rotulo, valor){
  if (valor === true) return '<span class="chip-beneficio chip-sim">✓ '+escapeHtml(rotulo)+'</span>';
  if (valor === false) return '<span class="chip-beneficio chip-nao">— '+escapeHtml(rotulo)+'</span>';
  return '';
}

// ---------- Filtros dinâmicos (Departamento a partir das Regras; Tipo e Centro de Custo a partir da base) ----------
function popularFiltroDepartamento(){
  const selDepto = document.getElementById('f-departamento');
  const atual = selDepto.value;
  selDepto.innerHTML = '<option value="">Departamento: todos</option>' + (REGRAS.departamentos||[]).map(function(d){
    return '<option value="'+escapeHtml(d.codigo)+'">'+escapeHtml(d.nome)+'</option>';
  }).join('');
  if (Array.from(selDepto.options).some(function(o){ return o.value === atual; })) selDepto.value = atual;
}
function popularFiltrosDinamicos(){
  popularFiltroDepartamento();
  const tipos = Array.from(new Set(COLABORADORES.map(function(c){ return c.tipo_contratacao; }).filter(Boolean))).sort();
  const ccs = Array.from(new Set(COLABORADORES.map(function(c){ return c.centro_custo; }).filter(Boolean))).sort();
  const selTipo = document.getElementById('f-tipo');
  selTipo.innerHTML = '<option value="">Tipo: todos</option>';
  tipos.forEach(function(t){
    const opt = document.createElement('option'); opt.value = t; opt.textContent = t; selTipo.appendChild(opt);
  });
  const selCc = document.getElementById('f-cc');
  selCc.innerHTML = '<option value="">Centro de Custo: todos</option>';
  ccs.forEach(function(cc){
    const opt = document.createElement('option'); opt.value = cc; opt.textContent = cc; selCc.appendChild(opt);
  });
}

// ---------- Exportar CSV (visão filtrada, para o financeiro) ----------
function exportarCSV(){
  const linhas = Array.from(document.querySelectorAll('.link-nome')).map(function(btn){
    return COLABORADORES.find(function(x){ return x.id === btn.getAttribute('data-id'); });
  }).filter(Boolean);
  if (!linhas.length){ toast('Nada para exportar com os filtros atuais.'); return; }
  const cab = ['Nome','CPF','Centro de Custo','Departamento','Tipo','Status','Origem','Cesta Básica','Conta Contábil (referência)','Alerta'];
  const linhasCsv = linhas.map(function(c){
    return [
      c.nome||'', c.cpf||'', c.centro_custo||'', c.departamento?rotuloDepartamento(c.departamento):'',
      c.tipo_contratacao||'', c.status||'', rotuloOrigem(c.origem_fonte), c.is_cesta_basica_elegivel?'Sim':'Não',
      contaContabilReferencia(c), inconsistenciaContabil(c)||''
    ].map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(';');
  });
  const csv = '﻿' + cab.join(';') + '\n' + linhasCsv.join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'colaboradores-lnb-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- Modal genérico (fecha com Esc / clique fora) ----------
function abrirModal(html){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = '<div class="modal">'+html+'</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(ev){ if (ev.target === overlay) overlay.remove(); });
  function onEsc(ev){ if (ev.key === 'Escape'){ overlay.remove(); document.removeEventListener('keydown', onEsc); } }
  document.addEventListener('keydown', onEsc);
  return overlay;
}

// ---------- Pop-up de detalhes / edição de um colaborador ----------
async function abrirDetalhesColaborador(c){
  const overlay = abrirModal(
    '<div class="carregando-detalhes">Carregando detalhes de '+escapeHtml(c.nome||'colaborador')+'…</div>'+
    '<div class="acoes"><button class="cancelar">Fechar</button></div>'
  );
  overlay.querySelector('.modal').classList.add('modal-lg');
  overlay.querySelector('.cancelar').onclick = function(){ overlay.remove(); };

  let rh = null;
  if (c.rh_colaborador_id){
    try{
      const r = await fetch(SUPABASE_URL+'/rest/v1/rh_colaboradores?id=eq.'+c.rh_colaborador_id+'&select=*', {
        headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+AUTH_SESSION.access_token}
      });
      if (r.ok){ const arr = await r.json(); rh = arr[0] || null; }
    }catch(e){ /* segue sem dados de RH */ }
  }

  if (!PODE_EDITAR){
    renderDetalhesSomenteLeitura(overlay, c, rh);
  } else {
    renderFormularioEdicao(overlay, c, rh);
  }
}

function opcoesDepartamento(selecionado){
  const deps = REGRAS.departamentos || [];
  return '<option value="">—</option>' + deps.map(function(d){
    return '<option value="'+escapeHtml(d.codigo)+'" '+(selecionado===d.codigo?'selected':'')+'>'+escapeHtml(d.nome)+'</option>';
  }).join('');
}
function opcoesTipo(selecionado){
  const base = (REGRAS.tipos_contratacao || []).slice();
  if (selecionado && base.indexOf(selecionado) === -1) base.push(selecionado); // preserva valor atual mesmo se fora da lista configurada
  return '<option value="">—</option>' + base.map(function(t){
    return '<option value="'+escapeHtml(t)+'" '+(selecionado===t?'selected':'')+'>'+escapeHtml(t)+'</option>';
  }).join('');
}

  }

  overlay.querySelector('.modal').innerHTML =
    '<h3 style="margin:0 0 4px">'+escapeHtml(c.nome||'(sem nome)')+'</h3>' +
    '<div style="font-size:12px;color:#6b7280;margin-bottom:6px">'+escapeHtml(c.cpf||'CPF não informado')+'</div>' +
    (alerta ? '<div class="aviso-inconsistencia" id="ed-aviso-consist">⚠ '+escapeHtml(alerta)+'</div>' : '<div id="ed-aviso-consist"></div>') +
    '<div class="conta-referencia" id="ed-conta-ref">Conta contábil de referência: <b>'+escapeHtml(contaContabilReferencia(c))+'</b> (informativo)</div>' +
    '<h4>Dados Pessoais</h4>' + camposPessoais +

  // conforme o usuário muda Departamento / Centro de Custo / Tipo.
  function recalcular(){
    const rascunho = {
      departamento: document.getElementById('ed-depto').value,
      centro_custo: document.getElementById('ed-cc').value,
      tipo_contratacao: document.getElementById('ed-tipo').value
    };
    const av = inconsistenciaContabil(rascunho);
    document.getElementById('ed-aviso-consist').innerHTML = av ? '⚠ '+escapeHtml(av) : '';
    document.getElementById('ed-aviso-consist').className = av ? 'aviso-inconsistencia' : '';
    document.getElementById('ed-conta-ref').innerHTML = 'Conta contábil de referência: <b>'+escapeHtml(contaContabilReferencia(rascunho))+'</b> (informativo)';
    const sugestao = sugerirDepartamentoPorCc(rascunho.centro_custo);

      document.getElementById('ed-usar-sugestao').onclick = function(){ document.getElementById('ed-depto').value = sugestao; recalcular(); };
    } else {
      elSug.innerHTML = '';
    }
  }
  ['ed-depto','ed-cc','ed-tipo'].forEach(function(id){
    document.getElementById(id).addEventListener('change', recalcular);
    document.getElementById(id).addEventListener('input', recalcular);
  });
  recalcular();

  document.getElementById('ed-salvar').onclick = async function(){
    const btn = document.getElementById('ed-salvar');
    btn.disabled = true; btn.textContent = 'Salvando…';
    try{
      await salvarEdicaoColaborador(c, rh, temRh);
      overlay.remove();
    }catch(e){
      toast(e.message || 'Falha ao salvar.');
      btn.disabled = false; btn.textContent = 'Salvar';
    }
  };
}

async function patchColaboradores(ids, payload){

      'Authorization':'Bearer '+AUTH_SESSION.access_token,

async function salvarEdicaoColaborador(c, rh, temRh){
  const novoCc = document.getElementById('ed-cc').value.trim();
  const novoDepto = document.getElementById('ed-depto').value;
  const novoTipo = document.getElementById('ed-tipo').value;
  const novoStatus = document.getElementById('ed-status').value;
  const novaObs = document.getElementById('ed-obs').value;
  const novaCesta = document.getElementById('ed-cesta').checked;

  if (!novoDepto){ throw new Error('Selecione um Departamento antes de salvar.'); }
  if (!novoTipo){ throw new Error('Selecione um Tipo de contratação antes de salvar.'); }

  const payloadMaster = {};
  const logMaster = [];
  if (novoCc !== (c.centro_custo||'')){ payloadMaster.centro_custo = novoCc; logMaster.push('Centro de Custo: "'+(c.centro_custo||'—')+'" → "'+novoCc+'"'); }
  if (novoDepto !== (c.departamento||'')){ payloadMaster.departamento = novoDepto; logMaster.push('Departamento: "'+(c.departamento?rotuloDepartamento(c.departamento):'—')+'" → "'+rotuloDepartamento(novoDepto)+'"'); }
  if (novoTipo !== (c.tipo_contratacao||'')){ payloadMaster.tipo_contratacao = novoTipo; logMaster.push('Tipo: "'+(c.tipo_contratacao||'—')+'" → "'+novoTipo+'"'); }
  if (novoStatus !== (c.status||'')){ payloadMaster.status = novoStatus; logMaster.push('Status: "'+(c.status||'—')+'" → "'+novoStatus+'"'); }
  if (novaObs !== (c.observacoes||'')){ payloadMaster.observacoes = novaObs; logMaster.push('Observações alteradas'); }
  if (novaCesta !== !!c.is_cesta_basica_elegivel){ payloadMaster.is_cesta_basica_elegivel = novaCesta; logMaster.push('Cesta Básica: "'+(c.is_cesta_basica_elegivel?'Sim':'Não')+'" → "'+(novaCesta?'Sim':'Não')+'"'); }

  let erroRh = null;
  const payloadRh = {};
  const logRh = [];
  if (temRh){
    const novoEmail = document.getElementById('ed-email').value.trim();
    const novoTelefone = document.getElementById('ed-telefone').value.trim();
    if (novoEmail !== (rh.email||'')){ payloadRh.email = novoEmail; logRh.push('E-mail alterado'); }
    if (novoTelefone !== (rh.telefone||'')){ payloadRh.telefone = novoTelefone; logRh.push('Telefone alterado'); }
    if (PERMITIR_EDITAR_BENEFICIOS_RH){
      const novoVt = document.getElementById('ed-vt').checked;
      const novoVrva = document.getElementById('ed-vrva').checked;
      const novoSaude = document.getElementById('ed-saude').checked;
      const novoSeguro = document.getElementById('ed-seguro').checked;
      if (novoVt !== !!rh.opta_vale_transporte){ payloadRh.opta_vale_transporte = novoVt; logRh.push('Vale Transporte: "'+(rh.opta_vale_transporte?'Sim':'Não')+'" → "'+(novoVt?'Sim':'Não')+'"'); }
      if (novoVrva !== !!rh.opta_vr_va){ payloadRh.opta_vr_va = novoVrva; logRh.push('VR/VA: "'+(rh.opta_vr_va?'Sim':'Não')+'" → "'+(novoVrva?'Sim':'Não')+'"'); }
      if (novoSaude !== !!rh.opta_plano_saude){ payloadRh.opta_plano_saude = novoSaude; logRh.push('Plano de Saúde: "'+(rh.opta_plano_saude?'Sim':'Não')+'" → "'+(novoSaude?'Sim':'Não')+'"'); }
      if (novoSeguro !== !!rh.opta_seguro_vida){ payloadRh.opta_seguro_vida = novoSeguro; logRh.push('Seguro de Vida: "'+(rh.opta_seguro_vida?'Sim':'Não')+'" → "'+(novoSeguro?'Sim':'Não')+'"'); }
    }
  }

  if (!Object.keys(payloadMaster).length && !Object.keys(payloadRh).length){
    toast('Nada foi alterado.');
    return;
  }

  if (Object.keys(payloadMaster).length){
    payloadMaster.updated_by = AUTH_SESSION.uid || null;
    await patchColaboradores([c.id], payloadMaster);
    Object.assign(c, payloadMaster);
  }

  if (Object.keys(payloadRh).length){
    try{
      await patchRhColaborador(c.rh_colaborador_id, payloadRh);
      Object.assign(rh, payloadRh);
    }catch(e){
      erroRh = e.message;
    }
  }

  if (logMaster.length) await registrarLog('editar_colaborador', c.nome+' — '+logMaster.join('; '));
  if (logRh.length && !erroRh) await registrarLog('editar_colaborador_rh', c.nome+' — '+logRh.join('; '));

  renderTabela();

  if (erroRh){
    toast('Dados do colaborador salvos. Falha ao salvar contato/benefícios do RH: '+erroRh);
  } else {
    toast('Colaborador atualizado com sucesso.');
  }
}

    '<div class="regras-ajuda">Ex.: Centro de Custo iniciado com "8" sugere o departamento "Projetos". Usado para o alerta de consistência e a sugestão no pop-up de edição — não move ninguém sozinho.</div>'+
    '<div id="reg-ccs">'+(REGRAS.regras_cc_departamento||[]).map(function(r){ return linhaRegraCc(r.prefixo, r.departamento); }).join('')+'</div>'+
    '<button type="button" class="regras-add" id="reg-add-cc">+ Adicionar regra</button></div>'+
    '<div class="regras-secao"><h4>Arbitragem</h4>'+
    '<div class="regras-ajuda">Combinação de conta contábil + centro de custo que define Arbitragem (hoje só existe dentro do benefício Seguro de Vida).</div>'+
    '<div class="regras-grade-arb">'+
    '<div><label>Conta contábil</label><input type="text" id="reg-arb-conta" value="'+escapeHtml((REGRAS.arbitragem||{}).conta||'')+'"></div>'+
    '<div><label>Centro de Custo</label><input type="text" id="reg-arb-cc" value="'+escapeHtml((REGRAS.arbitragem||{}).centro_custo||'')+'"></div>'+
    '<div><label>Departamento correspondente</label><select id="reg-arb-depto">'+opcoesDepartamento((REGRAS.arbitragem||{}).departamento)+'</select></div>'+
    '<div><label>Benefício onde se aplica</label><input type="text" id="reg-arb-beneficio" value="'+escapeHtml((REGRAS.arbitragem||{}).beneficio||'')+'"></div>'+
    '</div></div>'+
    '<div class="acoes"><button class="cancelar">Cancelar</button><button class="confirmar" id="reg-salvar">Salvar Regras</button></div>'
  );
  overlay.querySelector('.modal').classList.add('modal-regras');
  overlay.querySelector('.cancelar').onclick = function(){ overlay.remove(); };

  function religarRemoveBotoes(){
    overlay.querySelectorAll('.reg-rm').forEach(function(btn){
      btn.onclick = function(){ btn.closest('.regras-linha').remove(); };
    });
  }
  religarRemoveBotoes();

  document.getElementById('reg-add-depto').onclick = function(){
    document.getElementById('reg-deps').insertAdjacentHTML('beforeend', linhaRegraDepto('',''));
    religarRemoveBotoes();
  };
  document.getElementById('reg-add-cc').onclick = function(){
    document.getElementById('reg-ccs').insertAdjacentHTML('beforeend', linhaRegraCc('', ''));
    religarRemoveBotoes();
  };

  document.getElementById('reg-salvar').onclick = async function(){
    const btn = document.getElementById('reg-salvar');
    const deps = Array.from(overlay.querySelectorAll('.reg-dep-row')).map(function(row){
      return { codigo: row.querySelector('.reg-dep-cod').value.trim(), nome: row.querySelector('.reg-dep-nome').value.trim() };
    }).filter(function(d){ return d.codigo && d.nome; });
    const tipos = document.getElementById('reg-tipos').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    const ccs = Array.from(overlay.querySelectorAll('.reg-cc-row')).map(function(row){
      return { prefixo: row.querySelector('.reg-cc-prefixo').value.trim(), departamento: row.querySelector('.reg-cc-depto').value };
    }).filter(function(r){ return r.prefixo && r.departamento; });
    const arbitragem = {
      conta: document.getElementById('reg-arb-conta').value.trim(),
      centro_custo: document.getElementById('reg-arb-cc').value.trim(),
      departamento: document.getElementById('reg-arb-depto').value,
      beneficio: document.getElementById('reg-arb-beneficio').value.trim()
    };
    if (!deps.length){ toast('Cadastre pelo menos um departamento.'); return; }
    if (!tipos.length){ toast('Cadastre pelo menos um tipo de contratação.'); return; }
    const novasRegras = { departamentos: deps, tipos_contratacao: tipos, regras_cc_departamento: ccs, arbitragem: arbitragem };
    btn.disabled = true; btn.textContent = 'Salvando…';
    try{
      await salvarRegrasAsync(novasRegras);
      REGRAS = novasRegras;
      REGRAS_VEM_DO_BANCO = true;
      await registrarLog('editar_regras_colaboradores', deps.length+' departamento(s), '+ccs.length+' regra(s) de CC→Departamento, tipos: '+tipos.join(', ')+', Arbitragem: conta '+arbitragem.conta+' / CC '+arbitragem.centro_custo);
      popularFiltroDepartamento();
      renderTabela();
      toast('Regras salvas.');
      overlay.remove();
    }catch(e){
      toast(e.message);
      btn.disabled = false; btn.textContent = 'Salvar Regras';
    }
  };
}

async function editarAtributoEmLoteAsync(campo, valor, rotuloParaMensagem){
  const rotulo = rotuloParaMensagem || valor;
  try{
    const ids = Array.from(SELECIONADOS);
    const nomes = COLABORADORES.filter(function(c){ return SELECIONADOS.has(c.id); }).map(function(c){ return c.nome; });
    const payload = {}; payload[campo] = valor; payload.updated_by = AUTH_SESSION.uid || null;
    await patchColaboradores(ids, payload);
    COLABORADORES.forEach(function(c){ if (SELECIONADOS.has(c.id)) c[campo] = valor; });
    renderTabela();
    await registrarLog('editar_lote_colaboradores', 'Campo "'+campo+'" definido como "'+rotulo+'" para: '+nomes.join(', '));
    toast(campo+' atualizado para '+ids.length+' colaborador(es).');
  }catch(e){ toast(e.message); }
}

async function ativarEmMassaAsync(ids){
  try{
    const nomes = COLABORADORES.filter(function(c){ return ids.indexOf(c.id) >= 0; }).map(function(c){ return c.nome; });
    await patchColaboradores(ids, { status:'Ativo', updated_by: AUTH_SESSION.uid || null });
    COLABORADORES.forEach(function(c){ if (ids.indexOf(c.id) >= 0) c.status = 'Ativo'; });
    SELECIONADOS.clear();
    renderTabela();
    atualizarBarraFlutuante();
    await registrarLog('ativar_lote_colaboradores', 'Ativados: '+nomes.join(', '));
    toast(ids.length + ' colaborador(es) ativado(s).');
  }catch(e){ toast(e.message); }
}

async function alterarBeneficiosEmMassaAsync(ids, mudancas){
  try{
    const nomes = COLABORADORES.filter(function(c){ return ids.indexOf(c.id) >= 0; }).map(function(c){ return c.nome; });
    const logPartes = [];

    const payloadMaster = {};
    if (mudancas.cesta !== null){ payloadMaster.is_cesta_basica_elegivel = mudancas.cesta; logPartes.push('Cesta Básica → '+(mudancas.cesta?'Sim':'Não')); }
    if (Object.keys(payloadMaster).length){
      payloadMaster.updated_by = AUTH_SESSION.uid || null;
      await patchColaboradores(ids, payloadMaster);
      COLABORADORES.forEach(function(c){ if (ids.indexOf(c.id) >= 0) Object.assign(c, payloadMaster); });
    }

    const payloadRh = {};
    if (mudancas.vt !== null){ payloadRh.opta_vale_transporte = mudancas.vt; logPartes.push('Vale Transporte → '+(mudancas.vt?'Sim':'Não')); }
    if (mudancas.vrva !== null){ payloadRh.opta_vr_va = mudancas.vrva; logPartes.push('VR/VA → '+(mudancas.vrva?'Sim':'Não')); }
    if (mudancas.saude !== null){ payloadRh.opta_plano_saude = mudancas.saude; logPartes.push('Assistência Médica → '+(mudancas.saude?'Sim':'Não')); }
    if (mudancas.seguro !== null){ payloadRh.opta_seguro_vida = mudancas.seguro; logPartes.push('Seguro de Vida → '+(mudancas.seguro?'Sim':'Não')); }

    let erroRh = null, semRh = 0;
    if (Object.keys(payloadRh).length){
      if (!PERMITIR_EDITAR_BENEFICIOS_RH){
        erroRh = 'Edição de benefícios do RH está desativada (PERMITIR_EDITAR_BENEFICIOS_RH = false).';
      } else {
        const rhIds = [];
        COLABORADORES.forEach(function(c){
          if (ids.indexOf(c.id) >= 0){ if (c.rh_colaborador_id) rhIds.push(c.rh_colaborador_id); else semRh++; }
        });
        if (rhIds.length){
          try{
            await patchRhColaboradores(rhIds, payloadRh);
          }catch(e){ erroRh = e.message; }
        }
      }
    }

    renderTabela();
    if (logPartes.length) await registrarLog('beneficios_lote_colaboradores', logPartes.join('; ')+' — para: '+nomes.join(', '));

    if (erroRh){
      toast('Cesta Básica (se marcada) foi salva. Falha ao salvar os demais benefícios no RH: '+erroRh);
    } else if (semRh){
      toast('Benefícios atualizados. '+semRh+' selecionado(s) sem vínculo com o RH não foram afetados nos benefícios do RH.');
    } else {
      toast('Benefícios atualizados para '+ids.length+' colaborador(es).');
    }
  }catch(e){ toast(e.message); }
}

async function atualizarCestaBasicaAsync(ids, valor){
  try{
    const nomes = COLABORADORES.filter(function(c){ return ids.indexOf(c.id) >= 0; }).map(function(c){ return c.nome; });
    await patchColaboradores(ids, { is_cesta_basica_elegivel: valor, updated_by: AUTH_SESSION.uid || null });
    COLABORADORES.forEach(function(c){ if (ids.indexOf(c.id) >= 0) c.is_cesta_basica_elegivel = valor; });
    renderTabela();
    await registrarLog('cesta_basica_lote', 'Cesta Básica '+(valor?'ligada':'removida')+' para: '+nomes.join(', '));
    toast('Cesta Básica ' + (valor?'liberada':'removida') + ' para ' + ids.length + ' colaborador(es).');
  }catch(e){ toast(e.message); renderTabela(); }
}

async function desligarEmMassaAsync(ids){
  try{
    const nomes = COLABORADORES.filter(function(c){ return ids.indexOf(c.id) >= 0; }).map(function(c){ return c.nome; });
    await patchColaboradores(ids, { status:'Desligado', updated_by: AUTH_SESSION.uid || null });
    COLABORADORES.forEach(function(c){ if (ids.indexOf(c.id) >= 0) c.status = 'Desligado'; });
    SELECIONADOS.clear();
    renderTabela();
    atualizarBarraFlutuante();
    await registrarLog('desligar_lote_colaboradores', 'Desligados: '+nomes.join(', '));
    toast(ids.length + ' colaborador(es) desligado(s). Nenhum registro foi apagado.');
  }catch(e){ toast(e.message); }
}

// ---------- Boot ----------
(async function boot(){
  lnbLoadSession();
  if (!AUTH_SESSION || !AUTH_SESSION.access_token){ location.replace('/'); return; }

  const acesso = await lnbMeuAcessoCentral();
  if (!lnbTemModulo(acesso, 'beneficios')){
    document.getElementById('lnb-loading').classList.add('lnb-hide');
    document.getElementById('lnb-negado').classList.remove('lnb-hide');
    return;
  }

  PODE_EDITAR = await lnbTemPermissaoAsync('beneficios','editar');

  await carregarRegrasAsync();

  try{
    COLABORADORES = await carregarColaboradoresAsync();
  }catch(e){
    document.getElementById('lnb-loading').textContent = 'Erro ao carregar: ' + e.message;
    return;
  }

  popularFiltrosDinamicos();
  if (PODE_EDITAR) document.getElementById('btn-regras').classList.remove('lnb-hide');

  document.getElementById('badge-modo').innerHTML = PODE_EDITAR ? '' : '<span class="badge-readonly">Somente leitura</span>';
  document.getElementById('lnb-loading').classList.add('lnb-hide');
  document.getElementById('lnb-app').classList.remove('lnb-hide');
  renderTabela();
})();
</script>
